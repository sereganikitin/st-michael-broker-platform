name: Link owner-confirmed broker-tour contract 32185337

# Exact one-row operation. Dry-run is the default. Source and production SHA,
# successful exact-source CI, fresh backup, plan hash, DB identity and pinned SSH
# host are required before apply. No CRM writes or registry-row deletions.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only plan or confirmed one-row apply
        type: choice
        options: [dry-run, apply]
        default: dry-run
        required: true
      expected_deployed_sha:
        description: Exact SHA currently attested by production health
        type: string
        required: true
      plan_sha256:
        description: Fingerprint from the reviewed dry-run, required for apply
        type: string
        default: ''
      confirmation:
        description: Apply requires LINK_CONFIRMED_32185337_ONLY
        type: string
        default: ''

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    name: Link the exact owner-confirmed registry row
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - name: Checkout reviewed exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate source, production and exact one-row plan
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          LINK_MODE: ${{ inputs.mode }}
          EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          LINK_CONFIRMATION: ${{ inputs.confirmation }}
          REQUEST_ACTOR: ${{ github.actor }}
          REQUEST_RUN_ID: ${{ github.run_id }}
          REQUEST_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCTION_PG_SYSTEM_IDENTIFIER: ${{ vars.PRODUCTION_PG_SYSTEM_IDENTIFIER }}
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_SHA: ${{ github.sha }}
          CANONICAL_REPOSITORY: sereganikitin/st-michael-broker-platform
          HEALTH_URL: https://broker.stmichael.ru/api/health
          GH_TOKEN: ${{ github.token }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          EXPECTED_SSH_FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          test "$EXPECTED_REPOSITORY" = "$CANONICAL_REPOSITORY" || { echo "Inspector is restricted to the canonical repository"; exit 1; }
          test "$EXPECTED_REF" = "refs/heads/master" || { echo "Inspector is restricted to master"; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid inspector SHA"; exit 1; }
          test -n "$SSH_HOST" -a -n "$SSH_USER" -a -n "$SSH_PRIVATE_KEY" -a -n "$DEPLOY_PATH" || { echo "Production SSH configuration is incomplete"; exit 1; }
          case "$SSH_HOST" in ""|-*|*[[:space:]]*) echo "Invalid SSH host"; exit 1;; esac
          [[ "$SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]{0,63}$ ]] || { echo "Invalid SSH user"; exit 1; }
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && test "$SSH_PORT" -ge 1 -a "$SSH_PORT" -le 65535 || { echo "Invalid SSH port"; exit 1; }
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Invalid deploy path"; exit 1; }
          case "$DEPLOY_PATH/" in *"/../"*|*"/./"*|*"//"*) echo "Unsafe deploy path"; exit 1;; esac
          [[ "$EXPECTED_SSH_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || { echo "Production SSH fingerprint variable is missing or invalid"; exit 1; }

          inspector_path=scripts/link-confirmed-tour-contract.js
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || { echo "Checked-out inspector source is not the dispatched exact SHA"; exit 1; }
          test -f "$inspector_path" -a ! -L "$inspector_path" || { echo "Inspector source is missing or unsafe"; exit 1; }
          inspector_sha=$(sha256sum -- "$inspector_path" | awk '{print $1}')
          [[ "$inspector_sha" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid inspector source hash"; exit 1; }

          for required_tool in curl gh jq; do
            command -v "$required_tool" >/dev/null || { echo "Required source-attestation tool is missing"; exit 1; }
          done

          case "$LINK_MODE" in dry-run|apply) ;; *) echo "Invalid link mode"; exit 1;; esac
          [[ "$EXPECTED_DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid expected deployed SHA"; exit 1; }
          [[ "$PRODUCTION_PG_SYSTEM_IDENTIFIER" =~ ^[0-9]+$ ]] || { echo "Missing database identity"; exit 1; }
          [[ "$REQUEST_ACTOR" =~ ^[A-Za-z0-9_-]{1,100}$ ]] || exit 1
          [[ "$REQUEST_RUN_ID" =~ ^[1-9][0-9]{5,19}$ ]] || exit 1
          [[ "$REQUEST_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || exit 1
          if [ "$LINK_MODE" = apply ]; then
            test "$LINK_CONFIRMATION" = LINK_CONFIRMED_32185337_ONLY || { echo "Apply is not confirmed"; exit 1; }
            [[ "$PLAN_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "Missing reviewed plan hash"; exit 1; }
            test "$REQUEST_RUN_ATTEMPT" = 1 || { echo "Rerun requires a new reviewed dispatch"; exit 1; }
          else
            PLAN_SHA256=none
            LINK_CONFIRMATION=none
          fi
          node --test scripts/link-confirmed-tour-contract.test.js > /dev/null 2>&1 || { echo "Exact-case tests failed"; exit 1; }
          current_master=$(gh api "/repos/$EXPECTED_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          test "$current_master" = "$EXPECTED_SHA" || { echo "Source is no longer exact master"; exit 1; }
          ci_runs=$(gh api --method GET "/repos/$EXPECTED_REPOSITORY/actions/workflows/deploy.yml/runs" -f head_sha="$EXPECTED_SHA" -f status=completed -f per_page=30)
          ci_run=$(printf '%s' "$ci_runs" | jq -er --arg sha "$EXPECTED_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "master" and .conclusion == "success")] | first.id')
          unset ci_runs
          [[ "$ci_run" =~ ^[0-9]+$ ]] || { echo "Successful exact-source CI is missing"; exit 1; }
          ci_jobs=$(gh api "/repos/$EXPECTED_REPOSITORY/actions/runs/$ci_run/jobs?per_page=100")
          printf '%s' "$ci_jobs" | jq -e 'any(.jobs[]; .name == "Build and test release commit" and .conclusion == "success")' >/dev/null || { echo "Exact-source verify job is not green"; exit 1; }
          unset ci_jobs
          if [ "$LINK_MODE" = apply ]; then
            backup_runs=$(gh api --method GET "/repos/$EXPECTED_REPOSITORY/actions/workflows/backup-production-loyalty-predeploy.yml/runs" -f head_sha="$EXPECTED_SHA" -f status=completed -f per_page=30)
            printf '%s' "$backup_runs" | jq -e --arg sha "$EXPECTED_SHA" --argjson now "$(date +%s)" 'any(.workflow_runs[]; .head_sha == $sha and .head_branch == "master" and .conclusion == "success" and ((.created_at | fromdateiso8601) <= $now) and ($now - (.created_at | fromdateiso8601) < 21600))' >/dev/null || { echo "Fresh successful exact-source backup is required"; exit 1; }
            unset backup_runs
          fi

          health_body=$(curl --fail --silent --show-error --max-time 15 --proto '=https' --tlsv1.2 "$HEALTH_URL")
          deployed_sha=$(printf '%s' "$health_body" | jq -er '.deployedSha | select(type == "string" and test("^[0-9a-f]{40}$"))')
          unset health_body
          test "$deployed_sha" = "$EXPECTED_DEPLOYED_SHA" || { echo "Production SHA differs from explicit expectation"; exit 1; }
          [[ "$deployed_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Public production health did not attest a valid deployed SHA"; exit 1; }
          compare_status=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/$EXPECTED_REPOSITORY/compare/$deployed_sha...$EXPECTED_SHA" \
            --jq '.status')
          case "$compare_status" in
            ahead|identical) ;;
            *) echo "Public production SHA is not a canonical ancestor of exact master source"; exit 1;;
          esac
          unset compare_status GH_TOKEN

          runner_temp=${RUNNER_TEMP:-/tmp}
          test -d "$runner_temp" -a ! -L "$runner_temp" || { echo "Runner temp directory is missing or unsafe"; exit 1; }
          ssh_root=$(mktemp -d "$runner_temp/st-michael-confirmed-tour-link.XXXXXX")
          known_hosts="$ssh_root/known_hosts"
          private_key="$ssh_root/deploy-key"
          trap 'rm -f -- "$known_hosts" "$private_key"; rmdir -- "$ssh_root" 2>/dev/null || true' EXIT
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$private_key"
          chmod 600 "$private_key"
          timeout 15 ssh-keyscan -p "$SSH_PORT" -t ed25519 "$SSH_HOST" > "$known_hosts" 2>/dev/null
          chmod 600 "$known_hosts"
          mapfile -t fingerprints < <(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}' | sort -u)
          test "${#fingerprints[@]}" -eq 1 || { echo "Expected exactly one production ED25519 fingerprint"; exit 1; }
          test "${fingerprints[0]}" = "$EXPECTED_SSH_FINGERPRINT" || { echo "Production SSH host fingerprint mismatch"; exit 1; }

          # The delimiter contains characters outside the base64 alphabet, so
          # exact source bytes cannot terminate the streamed payload early.
          {
            cat <<'REMOTE_PREFIX'
          set -euo pipefail
          export LC_ALL=C
          deploy_path=$1
          expected_script_sha=$2
          expected_deployed_sha=$3
          source_sha=$4
          link_mode=$5
          plan_sha=$6
          confirmation=$7
          actor=$8
          run_id=$9
          run_attempt=${10}
          expected_pg=${11}
          canonical_origin=https://github.com/sereganikitin/st-michael-broker-platform.git

          for required_tool in base64 docker flock git readlink; do
            command -v "$required_tool" >/dev/null || { echo "Required inspector tool is missing"; exit 1; }
          done
          [[ "$deploy_path" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Invalid deploy path"; exit 1; }
          case "$deploy_path/" in *"/../"*|*"/./"*|*"//"*) echo "Unsafe deploy path"; exit 1;; esac
          [[ "$expected_script_sha" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid inspector source hash"; exit 1; }
          [[ "$expected_deployed_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid expected production SHA"; exit 1; }

          deploy_root=$(readlink -f -- "$deploy_path")
          test -n "$deploy_root" -a "$deploy_root" != "/" -a -d "$deploy_root" || { echo "Resolved deploy path must be an existing absolute non-root directory"; exit 1; }

          test -f /tmp/st-michael-production-deploy.lock -a ! -L /tmp/st-michael-production-deploy.lock || { echo "Production deploy lock is missing or unsafe"; exit 1; }
          exec 9</tmp/st-michael-production-deploy.lock
          flock -x -n 9 || { echo "A production deploy or migration holds the server lock"; exit 1; }

          cd -- "$deploy_root"
          test "$(git rev-parse --show-toplevel 2>/dev/null)" = "$deploy_root" || { echo "Deploy path is not the repository root"; exit 1; }
          test "$(git remote get-url origin)" = "$canonical_origin" || { echo "Production origin is not canonical"; exit 1; }
          test "$(git symbolic-ref --short HEAD 2>/dev/null)" = "master" || { echo "Production checkout is not on master"; exit 1; }
          production_sha=$(git rev-parse HEAD)
          [[ "$production_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid production checkout SHA"; exit 1; }
          test "$production_sha" = "$expected_deployed_sha" || { echo "Production checkout differs from public health attestation"; exit 1; }
          test "$(git rev-parse refs/heads/master)" = "$production_sha" || { echo "Production master and checkout differ"; exit 1; }

          test "$(docker inspect --format '{{.State.Running}}' st-michael-api 2>/dev/null)" = "true" || { echo "Production API container is not running"; exit 1; }
          test "$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.service" }}' st-michael-api 2>/dev/null)" = "api" || { echo "Unexpected production API container"; exit 1; }
          container_sha=$(docker exec st-michael-api sh -c 'printf %s "$GIT_SHA"')
          test "$container_sha" = "$production_sha" || { echo "Production API image and checkout differ"; exit 1; }

          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] && [[ "$expected_pg" =~ ^[0-9]+$ ]] || exit 1
          [[ "$actor" =~ ^[A-Za-z0-9_-]{1,100}$ ]] && [[ "$run_id" =~ ^[1-9][0-9]{5,19}$ ]] || exit 1
          case "$link_mode" in dry-run|apply) ;; *) exit 1;; esac
          if [ "$link_mode" = apply ]; then
            test "$confirmation" = LINK_CONFIRMED_32185337_ONLY && [[ "$plan_sha" =~ ^[0-9a-f]{64}$ ]] && test "$run_attempt" = 1 || exit 1
          fi

          base64 -d <<'CONFIRMED_TOUR_LINK_PAYLOAD' | docker exec -i \
            -e CONFIRMED_LINK_MODE="$link_mode" -e CONFIRMED_LINK_SOURCE_SHA="$source_sha" \
            -e CONFIRMED_LINK_DEPLOYED_SHA="$expected_deployed_sha" -e CONFIRMED_LINK_PLAN_SHA256="$plan_sha" \
            -e CONFIRMED_LINK_CONFIRMATION="$confirmation" -e CONFIRMED_LINK_CI_ATTESTED=true \
            -e CONFIRMED_LINK_ACTOR="$actor" -e CONFIRMED_LINK_RUN_ID="$run_id" \
            -e CONFIRMED_LINK_RUN_ATTEMPT="$run_attempt" -e PRODUCTION_PG_SYSTEM_IDENTIFIER="$expected_pg" \
            st-michael-api sh -c '
            set -eu
            expected_script_sha=$1
            case "$expected_script_sha" in ""|*[!0-9a-f]*) exit 1;; esac
            test "${#expected_script_sha}" -eq 64
            for required_tool in mktemp node rm sha256sum; do
              command -v "$required_tool" >/dev/null || exit 1
            done
            test -n "${DATABASE_URL:-}"
            umask 077
            inspector=$(mktemp /app/scripts/.confirmed-tour-link.XXXXXX)
            cleanup() { rm -f -- "$inspector"; }
            trap cleanup EXIT HUP INT TERM
            cat > "$inspector"
            actual_script_sha=$(sha256sum "$inspector")
            actual_script_sha=${actual_script_sha%% *}
            test "$actual_script_sha" = "$expected_script_sha"
            node "$inspector"
          ' inspector "$expected_script_sha"
          REMOTE_PREFIX
            base64 -w 0 -- "$inspector_path"
            printf '\nCONFIRMED_TOUR_LINK_PAYLOAD\n'
          } | timeout --foreground 6m ssh -T -i "$private_key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o NumberOfPasswordPrompts=0 \
            -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            "${SSH_USER}@${SSH_HOST}" \
            "bash -s -- '$DEPLOY_PATH' '$inspector_sha' '$deployed_sha' '$EXPECTED_SHA' '$LINK_MODE' '$PLAN_SHA256' '$LINK_CONFIRMATION' '$REQUEST_ACTOR' '$REQUEST_RUN_ID' '$REQUEST_RUN_ATTEMPT' '$PRODUCTION_PG_SYSTEM_IDENTIFIER'"
