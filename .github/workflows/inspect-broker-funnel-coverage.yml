name: Inspect broker funnel coverage (read-only)

on:
  workflow_dispatch:
    inputs:
      audit_type:
        type: choice
        default: funnel
        options: [funnel, open_period, release_status, agency, agency_release, agency_refresh_diagnostic]

concurrency:
  group: inspect-broker-funnel-coverage
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: SSH and inspect
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          fingerprint: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            AUDIT_SHA='${{ github.sha }}'
            printf '%s' "$AUDIT_SHA" | grep -Eq '^[0-9a-f]{40}$'
            git fetch https://github.com/sereganikitin/st-michael-broker-platform.git audit/broker-tour-20261109
            test "$(git rev-parse FETCH_HEAD)" = "$AUDIT_SHA"
            if [ '${{ inputs.audit_type }}' = release_status ]; then printf 'RELEASE_PHASE api_build_processes=%s web_build_processes=%s\n' "$(pgrep -fc '[d]ocker compose.*build api' || true)" "$(pgrep -fc '[d]ocker compose.*build web' || true)"; fi
            case '${{ inputs.audit_type }}' in funnel) SCRIPT=scripts/audit-broker-tour-current.cjs ;; open_period) SCRIPT=scripts/probe-loyalty-open-period.cjs ;; release_status) SCRIPT=scripts/probe-release-phase.cjs ;; agency) SCRIPT=scripts/audit-agency-profile-current.cjs ;; agency_release) SCRIPT=scripts/probe-agency-freshness-release.cjs ;; agency_refresh_diagnostic) SCRIPT=scripts/diagnose-agency-profile-refresh.cjs ;; *) exit 1 ;; esac
            set -o pipefail
            git show "$AUDIT_SHA:$SCRIPT" | timeout 600 docker exec -i st-michael-api node
            printf "AUDIT_PROCESS_EXIT 0\n"
