name: Inspect exact alerted reconciliation case without writes
on:
  workflow_dispatch: {}
concurrency:
  group: production-deploy
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exact source and pinned SSH read-only inspection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SOURCE: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          ATTEMPT: ${{ github.run_attempt }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          PIN: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
          DEPLOY: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          test "$REPO" = sereganikitin/st-michael-broker-platform
          test "$REF" = refs/heads/master
          test "$ACTOR" = mefremov888-ai
          test "$ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test "$(gh api /repos/$REPO/git/ref/heads/master --jq '.object.sha')" = "$SOURCE"
          gh api "/repos/$REPO/actions/workflows/deploy.yml/runs?head_sha=$SOURCE&status=completed&per_page=30" | jq -e --arg sha "$SOURCE" 'any(.workflow_runs[]; .head_sha==$sha and .event=="push" and .conclusion=="success")' >/dev/null
          [[ "$PIN" =~ ^SHA256:[A-Za-z0-9+/]{43}$ && "$SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]{0,63}$ && "$PORT" =~ ^[0-9]{1,5}$ ]]
          case "$HOST" in ''|-*|*[[:space:]]*) exit 1;; esac
          [[ "$DEPLOY" =~ ^/[A-Za-z0-9._/-]+$ ]]
          case "$DEPLOY/" in *'/../'*|*'/./'*|*'//'*) exit 1;; esac
          node --test scripts/inspect-exact-reconciliation-case.test.cjs
          work=$(mktemp -d); umask 077
          trap 'rm -f -- "$work/key" "$work/hosts"; rmdir -- "$work"' EXIT
          printf '%s\n' "$KEY" > "$work/key"; chmod 600 "$work/key"; unset KEY
          timeout 15 ssh-keyscan -p "$PORT" -t ed25519 "$HOST" > "$work/hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$work/hosts" -E sha256 | awk '{print $2}' | sort -u)" = "$PIN"
          script_sha=$(sha256sum scripts/inspect-exact-reconciliation-case.cjs | cut -d' ' -f1)
          {
            cat <<'REMOTE'
          set -euo pipefail
          export LC_ALL=C GIT_OPTIONAL_LOCKS=0
          root=$(readlink -f "$1"); expected=$2
          test "$root" != / -a -d "$root"; cd "$root"
          test "$(git rev-parse --show-toplevel)" = "$root"
          test "$(git remote get-url origin)" = https://github.com/sereganikitin/st-michael-broker-platform.git
          test -f /tmp/st-michael-production-deploy.lock -a ! -L /tmp/st-michael-production-deploy.lock
          exec 9</tmp/st-michael-production-deploy.lock; flock -s -n 9
          test "$(docker context show)" = default
          test "$(docker context inspect default --format '{{.Endpoints.docker.Host}}')" = unix:///var/run/docker.sock
          test -z "${DOCKER_HOST:-}" -a -z "${DOCKER_CONTEXT:-}"
          identity=$(docker inspect --format '{{.Id}}:{{.State.StartedAt}}' st-michael-api)
          test "$(docker exec st-michael-api sh -c 'printf %s "$GIT_SHA"')" = 50c88ff5cef87894394c2d563904e2befafd781a
          work=$(mktemp -d /tmp/stm-exact-case.XXXXXX)
          trap 'rm -f -- "$work/script.cjs"; rmdir -- "$work"' EXIT
          base64 -d > "$work/script.cjs" <<'SCRIPT'
          REMOTE
            base64 -w 0 scripts/inspect-exact-reconciliation-case.cjs
            printf '\nSCRIPT\n'
            cat <<'REMOTE'
          test "$(sha256sum "$work/script.cjs" | cut -d' ' -f1)" = "$expected"
          printf 'CHECKOUT_STATE={"trackedChanges":%s}\n' "$(git diff HEAD --name-only | wc -l)"
          # Only tracked paths and hashes; never file contents or environment.
          git diff HEAD --name-only -z | while IFS= read -r -d '' path; do
            case "$path" in *[!A-Za-z0-9_./-]*) exit 1;; esac
            test -f "$path" -a ! -L "$path"
            printf 'TRACKED_CHANGE={"path":"%s","sha256":"%s"}\n' "$path" "$(sha256sum -- "$path" | cut -d' ' -f1)"
          done
          docker exec -i -w /app -e EXEC_EXACT_CASE=1 st-michael-api node < "$work/script.cjs"
          test "$(docker inspect --format '{{.Id}}:{{.State.StartedAt}}' st-michael-api)" = "$identity"
          REMOTE
          } | timeout 6m ssh -T -i "$work/key" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/hosts" -o ConnectTimeout=15 "$SSH_USER@$HOST" "bash -s -- '$DEPLOY' '$script_sha'"
