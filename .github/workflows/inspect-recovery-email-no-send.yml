name: Inspect recovery email without sending (read-only, PII-safe)

# One SMTP verify only; no reset request, account change or message submission.
on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Authorized account eligibility diagnostic; never sent an email'
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  inspect:
    name: Read-only recovery diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Checkout exact reviewed inspector
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate source and inspect recovery without sending
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_SHA: ${{ github.sha }}
          CANONICAL_REPOSITORY: sereganikitin/st-michael-broker-platform
          HEALTH_URL: https://broker.stmichael.ru/api/health
          GH_TOKEN: ${{ github.token }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          EXPECTED_SSH_FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          # Strict ASCII input before masking; no raw email in env preambles.
          EMAIL_INPUT=$(jq -er '.inputs.email | select(type == "string") | select(length <= 254 and test("^[A-Za-z0-9][A-Za-z0-9._%+\\-]{0,63}@[A-Za-z0-9]([A-Za-z0-9\\-]{0,61}[A-Za-z0-9])?(\\.[A-Za-z0-9]([A-Za-z0-9\\-]{0,61}[A-Za-z0-9])?)+$"))' "$GITHUB_EVENT_PATH")
          printf '::add-mask::%s\n' "$EMAIL_INPUT"
          EMAIL_LOWER=$(printf '%s' "$EMAIL_INPUT" | LC_ALL=C tr '[:upper:]' '[:lower:]')
          printf '::add-mask::%s\n' "$EMAIL_LOWER"
          unset EMAIL_LOWER
          test "$EXPECTED_REPOSITORY" = "$CANONICAL_REPOSITORY" || { echo "Restricted to the canonical repository"; exit 1; }
          test "$EXPECTED_REF" = "refs/heads/master" || { echo "Restricted to master"; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid source SHA"; exit 1; }
          test -n "$SSH_HOST" -a -n "$SSH_USER" -a -n "$SSH_PRIVATE_KEY" -a -n "$DEPLOY_PATH" || { echo "Production SSH configuration incomplete"; exit 1; }
          case "$SSH_HOST" in ""|-*|*[[:space:]]*) echo "Invalid SSH host"; exit 1;; esac
          [[ "$SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]{0,63}$ ]] || { echo "Invalid SSH user"; exit 1; }
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && test "$SSH_PORT" -ge 1 -a "$SSH_PORT" -le 65535 || { echo "Invalid SSH port"; exit 1; }
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Invalid deploy path"; exit 1; }
          case "$DEPLOY_PATH/" in *"/../"*|*"/./"*|*"//"*) echo "Unsafe deploy path"; exit 1;; esac
          [[ "$EXPECTED_SSH_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || { echo "Missing/invalid SSH fingerprint"; exit 1; }

          inspector_path=scripts/inspect-recovery-email-no-send.js
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || { echo "Source differs from exact workflow SHA"; exit 1; }
          test -f "$inspector_path" -a ! -L "$inspector_path" || { echo "Inspector missing or unsafe"; exit 1; }
          inspector_sha=$(sha256sum -- "$inspector_path" | awk '{print $1}')
          [[ "$inspector_sha" =~ ^[0-9a-f]{64}$ ]] || exit 1

          for required_tool in curl gh jq; do
            command -v "$required_tool" >/dev/null || { echo "Required attestation tool missing"; exit 1; }
          done
          health_body=$(curl --fail --silent --show-error --max-time 15 --proto '=https' --tlsv1.2 "$HEALTH_URL")
          deployed_sha=$(printf '%s' "$health_body" | jq -er '.deployedSha | select(type == "string" and test("^[0-9a-f]{40}$"))')
          unset health_body
          compare_status=$(gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/$EXPECTED_REPOSITORY/compare/$deployed_sha...$EXPECTED_SHA" --jq '.status')
          case "$compare_status" in ahead|identical) ;; *) echo "Production SHA is not a canonical ancestor"; exit 1;; esac
          unset compare_status GH_TOKEN

          runner_temp=${RUNNER_TEMP:-/tmp}
          test -d "$runner_temp" -a ! -L "$runner_temp" || exit 1
          ssh_root=$(mktemp -d "$runner_temp/st-michael-recovery-readonly.XXXXXX")
          known_hosts="$ssh_root/known_hosts"
          private_key="$ssh_root/deploy-key"
          trap 'rm -f -- "$known_hosts" "$private_key"; rmdir -- "$ssh_root" 2>/dev/null || true' EXIT
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$private_key"
          chmod 600 "$private_key"
          timeout 15 ssh-keyscan -p "$SSH_PORT" -t ed25519 "$SSH_HOST" > "$known_hosts" 2>/dev/null
          chmod 600 "$known_hosts"
          mapfile -t fingerprints < <(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}' | sort -u)
          test "${#fingerprints[@]}" -eq 1 || { echo "Expected one ED25519 fingerprint"; exit 1; }
          test "${fingerprints[0]}" = "$EXPECTED_SSH_FINGERPRINT" || { echo "SSH fingerprint mismatch"; exit 1; }

          {
            cat <<'REMOTE_PREFIX'
          set -euo pipefail
          export LC_ALL=C
          deploy_path=$1
          expected_script_sha=$2
          expected_deployed_sha=$3
          email=$4
          canonical_origin=https://github.com/sereganikitin/st-michael-broker-platform.git
          for required_tool in base64 docker flock git readlink; do
            command -v "$required_tool" >/dev/null || exit 1
          done
          [[ "$deploy_path" =~ ^/[A-Za-z0-9._/-]+$ ]] || exit 1
          case "$deploy_path/" in *"/../"*|*"/./"*|*"//"*) exit 1;; esac
          [[ "$expected_script_sha" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [[ "$expected_deployed_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "${#email}" -le 254 || exit 1
          email_pattern='^[A-Za-z0-9][A-Za-z0-9._%+\-]{0,63}@[A-Za-z0-9]([A-Za-z0-9\-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9\-]{0,61}[A-Za-z0-9])?)+$'
          [[ "$email" =~ $email_pattern ]] || exit 1
          deploy_root=$(readlink -f -- "$deploy_path")
          test -n "$deploy_root" -a "$deploy_root" != "/" -a -d "$deploy_root" || exit 1

          test -f /tmp/st-michael-production-deploy.lock -a ! -L /tmp/st-michael-production-deploy.lock || { echo "Deploy lock missing or unsafe"; exit 1; }
          exec 9</tmp/st-michael-production-deploy.lock
          flock -s -n 9 || { echo "Production deployment in progress"; exit 1; }
          cd -- "$deploy_root"
          test "$(git rev-parse --show-toplevel 2>/dev/null)" = "$deploy_root" || exit 1
          test "$(git remote get-url origin)" = "$canonical_origin" || exit 1
          test "$(git symbolic-ref --short HEAD 2>/dev/null)" = "master" || exit 1
          production_sha=$(git rev-parse HEAD)
          test "$production_sha" = "$expected_deployed_sha" || { echo "Checkout/health SHA differs"; exit 1; }
          test "$(git rev-parse refs/heads/master)" = "$production_sha" || exit 1
          test "$(docker inspect --format '{{.State.Running}}' st-michael-api 2>/dev/null)" = "true" || exit 1
          test "$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.service" }}' st-michael-api 2>/dev/null)" = "api" || exit 1
          container_sha=$(docker exec st-michael-api sh -c 'printf %s "$GIT_SHA"')
          test "$container_sha" = "$production_sha" || { echo "API image/checkout SHA differs"; exit 1; }

          # Exact bytes, temporary path, cleanup. No checkout or service changes.
          base64 -d <<'READ_ONLY_RECOVERY_PAYLOAD' | docker exec -i -e EMAIL="$email" st-michael-api sh -c '
            set -eu
            expected_script_sha=$1
            case "$expected_script_sha" in ""|*[!0-9a-f]*) exit 1;; esac
            test "${#expected_script_sha}" -eq 64
            for required_tool in mktemp node rm sha256sum; do
              command -v "$required_tool" >/dev/null || exit 1
            done
            umask 077
            inspector=$(mktemp /app/scripts/.inspect-recovery-email-no-send.XXXXXX)
            cleanup() { rm -f -- "$inspector"; }
            trap cleanup EXIT HUP INT TERM
            cat > "$inspector"
            actual_script_sha=$(sha256sum "$inspector")
            actual_script_sha=${actual_script_sha%% *}
            test "$actual_script_sha" = "$expected_script_sha"
            node "$inspector"
          ' inspector "$expected_script_sha"
          REMOTE_PREFIX
            base64 -w 0 -- "$inspector_path"
            printf '\nREAD_ONLY_RECOVERY_PAYLOAD\n'
          } | timeout --foreground 4m ssh -T -i "$private_key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o NumberOfPasswordPrompts=0 \
            -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "${SSH_USER}@${SSH_HOST}" \
            "bash -s -- '$DEPLOY_PATH' '$inspector_sha' '$deployed_sha' '$EMAIL_INPUT'"
