name: Inspect production backup incident (read-only)

on:
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  report:
    name: Inspect backup processes and resource pressure
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - name: Checkout exact reviewed diagnostic
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Validate source and report over pinned SSH
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          EXPECTED_SSH_FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          test "$EXPECTED_REPOSITORY" = sereganikitin/st-michael-broker-platform || exit 1
          test "$EXPECTED_REF" = refs/heads/master || exit 1
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || exit 1
          test -n "$SSH_HOST" -a -n "$SSH_USER" -a -n "$SSH_PRIVATE_KEY" -a -n "$DEPLOY_PATH" || exit 1
          case "$SSH_HOST" in ""|-*|*[[:space:]]*) exit 1;; esac
          [[ "$SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]{0,63}$ ]] || exit 1
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && test "$SSH_PORT" -ge 1 -a "$SSH_PORT" -le 65535 || exit 1
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || exit 1
          case "$DEPLOY_PATH/" in *"/../"*|*"/./"*|*"//"*) exit 1;; esac
          [[ "$EXPECTED_SSH_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || exit 1
          ssh_root=$(mktemp -d)
          known_hosts="$ssh_root/known_hosts"
          private_key="$ssh_root/deploy-key"
          trap 'rm -f -- "$known_hosts" "$private_key"; rmdir -- "$ssh_root" 2>/dev/null || true' EXIT
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$private_key"
          chmod 600 "$private_key"
          timeout 15 ssh-keyscan -p "$SSH_PORT" -t ed25519 "$SSH_HOST" > "$known_hosts" 2>/dev/null
          chmod 600 "$known_hosts"
          mapfile -t fingerprints < <(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}' | sort -u)
          test "${#fingerprints[@]}" -eq 1 || exit 1
          test "${fingerprints[0]}" = "$EXPECTED_SSH_FINGERPRINT" || exit 1
          timeout --foreground 6m ssh -T -i "$private_key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o NumberOfPasswordPrompts=0 \
            -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "${SSH_USER}@${SSH_HOST}" \
            "bash -s -- '$DEPLOY_PATH' '$EXPECTED_SHA'" <<'REMOTE'
          set -uo pipefail
          export LC_ALL=C GIT_OPTIONAL_LOCKS=0
          date -u
          uptime
          free -h
          df -h / /var/backups
          df -i / /var/backups
          echo IO_PRESSURE
          cat /proc/pressure/io /proc/pressure/memory /proc/pressure/cpu || true
          timeout 15 vmstat 1 8 || true
          echo PROCESS_CPU_AND_WAIT
          ps -eo pid,ppid,state,pcpu,pmem,wchan:28,comm --sort=-pcpu | head -26
          echo SUSPECT_PROCESS_METADATA
          for pid in 1295523 1295521 1192843; do
            if test -d /proc/$pid; then
              ps -p "$pid" -o pid,ppid,uid,state,lstart,pcpu,rss,comm
              sudo -n readlink /proc/$pid/exe /proc/$pid/cwd || true
              sudo -n cat /proc/$pid/cgroup /proc/$pid/io || true
              sudo -n sha256sum /proc/$pid/exe || true
            fi
          done
          echo REDIS_RUNTIME_METADATA
          docker inspect st-michael-redis --format 'image={{.Config.Image}} network={{.HostConfig.NetworkMode}} ports={{json .NetworkSettings.Ports}} mounts={{range .Mounts}}{{.Destination}} {{end}}'
          docker exec st-michael-redis redis-cli CONFIG GET bind protected-mode save appendonly maxmemory || true
          echo HOST_LISTENERS
          ss -ltn | awk 'NR==1 || /:6379 /'
          echo BLOCKED_PROCESSES
          ps -eo pid,ppid,state,wchan:28,comm | awk '$3 == "D"'
          echo DISK_STATS
          cat /proc/diskstats
          command -v iostat >/dev/null && timeout 10 iostat -xz 1 3 || true
          echo HISTORICAL_METRICS_AVAILABLE
          ls /var/log/sysstat/sa23 /var/log/sa/sa23 2>/dev/null || true
          command -v sar >/dev/null && timeout 10 sar -d -s 09:20:00 -e 10:05:00 || true
          echo DOCKER_DAEMON_ERROR_COUNTS
          sudo -n journalctl -u docker --since '2026-10-23 09:20:00 UTC' --no-pager | awk 'BEGIN {IGNORECASE=1} /no space left|ENOSPC/ {space++} /input.output error|I\/O error/ {io++} END {print "no_space_errors="space+0,"io_errors="io+0}'
          echo APP_ERROR_COUNTS
          docker logs --since 2026-10-23T09:20:00Z --until 2026-10-23T10:05:00Z st-michael-api 2>&1 | awk 'BEGIN {IGNORECASE=1} /no space left|ENOSPC/ {space++} /connection pool|P2024/ {pool++} /timeout|timed out/ {tout++} END {print "no_space_errors="space+0,"pool_errors="pool+0,"timeout_lines="tout+0}'
          echo FILESYSTEM_USAGE_BY_BACKUP
          timeout 10 sudo -n du -sh /var/backups/stmichael/loyalty-predeploy || true
          timeout 20 docker stats --no-stream || true
          docker ps -a --format 'CONTAINER={{.Names}} STATUS={{.Status}}'
          docker inspect st-michael-api st-michael-web st-michael-postgres --format 'name={{.Name}} restart={{.RestartCount}} oom={{.State.OOMKilled}} started={{.State.StartedAt}}' || true
          echo BACKUP_PROCESSES
          docker exec st-michael-postgres sh -c 'ps -eo pid,ppid,etime,comm | grep -E "pg_dump|pg_restore"' || true
          echo HOST_BACKUP_PROCESSES
          ps -eo pid,ppid,etime,comm | grep -E 'pg_dump|pg_restore|docker|sync' || true
          echo BACKUP_FILES
          timeout 10 sudo -n find /var/backups/stmichael/loyalty-predeploy -maxdepth 1 -type f -printf '%f bytes=%s modified=%TY-%Tm-%TdT%TH:%TM:%TS\n' || true
          echo DATABASE_ACTIVITY_AGGREGATES
          timeout 15 docker exec st-michael-postgres psql -U postgres -d broker_platform --no-psqlrc -Atc "SET statement_timeout='5s'; SELECT pid,application_name,state,wait_event_type,wait_event,now()-query_start AS age,pg_blocking_pids(pid) FROM pg_stat_activity WHERE datname=current_database() AND pid<>pg_backend_pid() ORDER BY query_start LIMIT 40;" || true
          echo KERNEL_RESOURCE_ERRORS
          sudo -n journalctl -k --since '2026-10-23 09:20:00 UTC' --no-pager | grep -iE 'out of memory|oom-kill|killed process|I/O error|no space left' | tail -15 || true
          for endpoint in / /api/health/ready; do
            curl --silent --show-error --connect-timeout 5 --max-time 10 --output /dev/null --write-out "endpoint=$endpoint http=%{http_code} total=%{time_total}\n" --resolve broker.stmichael.ru:443:127.0.0.1 "https://broker.stmichael.ru$endpoint" || true
          done
          echo inspection_only=true
          REMOTE
