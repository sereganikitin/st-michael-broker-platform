name: Inspect production Telegram outage (no sends)

on:
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  report:
    name: Inspect bot connectivity and sanitized logs
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - name: Checkout exact reviewed diagnostic
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Validate source and report over pinned SSH
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          EXPECTED_SSH_FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          test "$EXPECTED_REPOSITORY" = sereganikitin/st-michael-broker-platform || exit 1
          test "$EXPECTED_REF" = refs/heads/master || exit 1
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || exit 1
          test -n "$SSH_HOST" -a -n "$SSH_USER" -a -n "$SSH_PRIVATE_KEY" -a -n "$DEPLOY_PATH" || exit 1
          case "$SSH_HOST" in ""|-*|*[[:space:]]*) exit 1;; esac
          [[ "$SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]{0,63}$ ]] || exit 1
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && test "$SSH_PORT" -ge 1 -a "$SSH_PORT" -le 65535 || exit 1
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || exit 1
          case "$DEPLOY_PATH/" in *"/../"*|*"/./"*|*"//"*) exit 1;; esac
          [[ "$EXPECTED_SSH_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || exit 1
          ssh_root=$(mktemp -d)
          known_hosts="$ssh_root/known_hosts"
          private_key="$ssh_root/deploy-key"
          trap 'rm -f -- "$known_hosts" "$private_key"; rmdir -- "$ssh_root" 2>/dev/null || true' EXIT
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$private_key"
          chmod 600 "$private_key"
          timeout 15 ssh-keyscan -p "$SSH_PORT" -t ed25519 "$SSH_HOST" > "$known_hosts" 2>/dev/null
          chmod 600 "$known_hosts"
          mapfile -t fingerprints < <(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}' | sort -u)
          test "${#fingerprints[@]}" -eq 1 || exit 1
          test "${fingerprints[0]}" = "$EXPECTED_SSH_FINGERPRINT" || exit 1
          timeout --foreground 6m ssh -T -i "$private_key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o NumberOfPasswordPrompts=0 \
            -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "${SSH_USER}@${SSH_HOST}" \
            "bash -s -- '$DEPLOY_PATH' '$EXPECTED_SHA'" <<'REMOTE'
          set -euo pipefail
          export LC_ALL=C GIT_OPTIONAL_LOCKS=0
          root=$(readlink -f -- "$1"); source=$2
          test -n "$root" -a "$root" != / -a -d "$root"
          test -f /tmp/st-michael-production-deploy.lock -a ! -L /tmp/st-michael-production-deploy.lock
          exec 9</tmp/st-michael-production-deploy.lock; flock -s -n 9
          cd -- "$root"
          test "$(git rev-parse --show-toplevel)" = "$root"
          test "$(git remote get-url origin)" = https://github.com/sereganikitin/st-michael-broker-platform.git
          test "$(git symbolic-ref --short HEAD)" = master
          printf 'CHECKOUT_SHA=%s\n' "$(git rev-parse HEAD)"
          printf 'WORKFLOW_SHA=%s\n' "$source"
          printf 'API_SHA=%s\n' "$(docker exec st-michael-api sh -c 'printf %s "$GIT_SHA"')"
          python3 - <<'NETWORK'
          import socket,json,subprocess,pathlib,errno
          def call(*args):
              r=subprocess.run(args,capture_output=True,text=True,timeout=8)
              return r.returncode,r.stdout,r.stderr
          report={'interfaces':[],'destinations':[]}
          code,out,err=call('ip','-j','-6','address','show')
          if code==0:
              for entry in json.loads(out):
                  name=entry['ifname']; settings={}
                  for key in ['disable_ipv6','forwarding','accept_ra','autoconf','accept_ra_defrtr']:
                      p=pathlib.Path('/proc/sys/net/ipv6/conf')/name/key
                      if p.is_file():settings[key]=p.read_text().strip()
                  report['interfaces'].append({'name':name,'globalAddresses':sum(a.get('scope')=='global' for a in entry.get('addr_info',[])),'settings':settings})
          code,out,err=call('ip','-j','-6','route','show','default')
          report['defaultRouteCount']=len(json.loads(out)) if code==0 else None
          for target in ['api.telegram.org','www.google.com','example.com']:
              entry={'host':target,'ipv6':[]}
              try:
                  addresses=sorted(set(x[4][0] for x in socket.getaddrinfo(target,443,socket.AF_INET6,socket.SOCK_STREAM)))
                  entry['aaaaCount']=len(addresses)
                  for address in addresses[:2]:
                      rcode,rout,rerr=call('ip','-6','route','get',address)
                      result={'routeFound':rcode==0,'routeUnreachable':'unreachable' in (rout+rerr).lower()}
                      s=socket.socket(socket.AF_INET6,socket.SOCK_STREAM);s.settimeout(3)
                      try:s.connect((address,443));result['tcp']='connected'
                      except OSError as e:result['tcp']=errno.errorcode.get(e.errno,'TIMEOUT' if isinstance(e,TimeoutError) else 'OTHER')
                      finally:s.close()
                      entry['ipv6'].append(result)
              except OSError:entry['dnsError']=True
              report['destinations'].append(entry)
          import ipaddress,configparser,re
          saved=[]
          def is6(value):
              try:return ipaddress.ip_interface(str(value)).version==6
              except ValueError:return False
          try:
              import yaml
              for filename in sorted(pathlib.Path('/etc/netplan').glob('*.yaml')):
                  data=yaml.safe_load(filename.read_text()) or {}
                  for name,config in (data.get('network',{}).get('ethernets',{}) or {}).items():
                      saved.append({'source':str(filename),'interface':name,'ipv6AddressCount':sum(is6(a) for a in config.get('addresses',[])),'gateway6Present':bool(config.get('gateway6')),'ipv6DefaultRouteCount':sum(str(r.get('to')) in ['::/0','default'] and is6(r.get('via','')) for r in config.get('routes',[])),'dhcp6':config.get('dhcp6'),'acceptRA':config.get('accept-ra'),'matchByMac':bool(config.get('match',{}).get('macaddress'))})
          except (ImportError,OSError,ValueError):saved.append({'netplanRead':'unavailable'})
          for directory in ['/etc/systemd/network','/run/systemd/network']:
              for filename in sorted(pathlib.Path(directory).glob('*.network')):
                  values=[]
                  for line in filename.read_text().splitlines():
                      if '=' in line and not line.strip().startswith('#'):
                          k,v=line.strip().split('=',1)
                          if k in ['Address','Gateway','Destination','IPv6AcceptRA','DHCP']:values.append((k,v))
                  saved.append({'source':str(filename),'ipv6AddressCount':sum(k=='Address' and is6(v) for k,v in values),'ipv6GatewayCount':sum(k=='Gateway' and is6(v) for k,v in values),'ipv6DefaultCount':sum(k=='Destination' and v=='::/0' for k,v in values),'acceptRA':[v for k,v in values if k=='IPv6AcceptRA'],'dhcp':[v for k,v in values if k=='DHCP']})
          report['savedNetworkConfig']=saved
          provider={}
          metadata=pathlib.Path('/run/cloud-init/instance-data.json')
          if metadata.is_file():
              data=json.loads(metadata.read_text()).get('v1',{})
              for key in ['cloud_name','platform','subplatform']:
                  value=str(data.get(key,''))
                  if re.fullmatch('[A-Za-z0-9_ .:/()-]{0,100}',value):provider[key]=value
          report['provider']=provider
          processes=call('ps','-eo','comm')[1].splitlines()
          report['networkProcesses']={name:processes.count(name) for name in ['systemd-network','NetworkManager','dhclient','dhcpcd']}
          leases=[]
          for directory in ['/var/lib/dhcp','/var/lib/NetworkManager']:
              for filename in pathlib.Path(directory).glob('*lease*'):
                  if filename.is_file() and not filename.is_symlink():
                      content=filename.read_text(errors='replace')
                      leases.append({'name':filename.name,'containsIPv6Lease':bool(re.search(r'iaaddr\s+[0-9a-f:]+|ip6_address|ADDRESS6=',content)),'mtime':int(filename.stat().st_mtime)})
          report['leaseFiles']=leases
          code,out,err=call('journalctl','-u','systemd-networkd','--since','-20min','--no-pager','-o','cat','-n','300')
          report['recentNetworkdEvents']={term:sum(term.lower() in line.lower() for line in out.splitlines()) for term in ['DHCPv6','IPv6','advertisement','Failed','Could not','Gained carrier','Lost carrier','DHCPv4']}
          code,out,err=call('journalctl','-u','systemd-networkd','--since','2026-10-22 08:00:00 UTC','--until','2026-10-22 13:00:00 UTC','--no-pager','-o','json','-n','1000')
          trace=[]
          for raw in out.splitlines():
              event=json.loads(raw); message=event.get('MESSAGE','')
              terms=[term for term in ['DHCPv6','IPv6','advertisement','Reconfiguring','Configuring','Failed','Could not','Gained carrier','Lost carrier','DHCPv4'] if term.lower() in message.lower()]
              if terms:trace.append({'unixMicroseconds':event.get('__REALTIME_TIMESTAMP'),'categories':terms,'leaseLost':'lease lost' in message.lower()})
          report['networkdAroundRollout']=trace
          report['netplanFileTimes']=[{'name':p.name,'mtime':int(p.stat().st_mtime)} for p in pathlib.Path('/etc/netplan').glob('*.yaml') if p.is_file() and not p.is_symlink()]
          print('IPV6_DIAGNOSTIC='+json.dumps(report))
          NETWORK
          for endpoint in https://www.google.com/generate_204 https://example.com/; do
            printf 'IPV6_CONTROL endpoint=%s ' "$endpoint"
            set +e
            curl -6 --silent --show-error --output /dev/null --connect-timeout 5 --max-time 10 --write-out 'http=%{http_code} total=%{time_total}\n' "$endpoint"
            result=$?
            set -e
            printf 'IPV6_CONTROL_EXIT=%s\n' "$result"
          done
          for name in st-michael-api st-michael-tg-relay st-michael-telegram-quiet; do
            docker inspect "$name" --format 'CONTAINER={{.Name}} RUNNING={{.State.Running}} RESTARTS={{.RestartCount}}'
          done
          for family in -6 -4; do
            printf 'TELEGRAM_NETWORK family=%s ' "$family"
            set +e
            curl "$family" --silent --show-error --output /dev/null --connect-timeout 5 --max-time 15 \
              --write-out 'http=%{http_code} connect=%{time_connect} tls=%{time_appconnect} total=%{time_total}\n' https://api.telegram.org/
            result=$?
            set -e
            printf 'TELEGRAM_NETWORK_EXIT=%s\n' "$result"
          done
          classifier=$(cat <<'PY'
          import sys,re,json
          kind=sys.argv[1]; events=[]
          for line in sys.stdin:
              event=None
              if kind=='relay':
                  m=re.search(r'\b(GET|POST) /bot\*\*\*/(getUpdates|getMe|sendMessage)(?:\?[^ ]*)? -> ([0-9]{3}) ([0-9]+) ms',line)
                  if m:event={'method':m[1],'operation':m[2],'status':int(m[3]),'milliseconds':int(m[4])}
                  elif 'telegram_relay_upstream_unconfirmed=true' in line:event={'upstreamUnconfirmed':True}
              elif '[OpsInbox]' in line:
                  for operation in ['getUpdates','poll failed','sendMessage']:
                      if operation in line:
                          event={'operation':operation}
                          m=re.search(r'(?:HTTP |getUpdates )([0-9]{3})\b',line)
                          if m:event['status']=int(m[1])
                          codes=re.findall(r'\b(?:ETIMEDOUT|ECONNREFUSED|ECONNRESET|ENETUNREACH|EHOSTUNREACH|ENOTFOUND|EAI_AGAIN|UND_ERR_CONNECT_TIMEOUT|UND_ERR_HEADERS_TIMEOUT)\b',line)
                          if codes:event['networkCodes']=sorted(set(codes))
                          if 'fetch failed' in line:event['fetchFailed']=True
                          if 'aborted' in line.lower():event['aborted']=True
                          break
              if event:
                  stamp=re.match(r'([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z) ',line)
                  if stamp:event['at']=stamp[1]
                  events.append(event)
          from collections import Counter
          success=[e for e in events if e.get('status')==200 and e.get('operation')=='getUpdates']
          failures=[e for e in events if e.get('upstreamUnconfirmed') or e.get('status',0)>=400]
          before=[e for e in events if e.get('at','')<'2026-10-22T11:24:00Z']
          after=[e for e in events if '2026-10-22T11:24:00Z'<=e.get('at','')<'2026-10-22T19:24:00Z']
          hourly=Counter((e.get('at','')[:13], 'success' if e.get('status')==200 else 'failure') for e in events)
          timeline={'firstSuccess':success[0].get('at') if success else None,'lastSuccess':success[-1].get('at') if success else None,'firstFailure':failures[0].get('at') if failures else None,'lastFailure':failures[-1].get('at') if failures else None,'beforeRollout':dict(Counter(str(e.get('status','upstreamUnconfirmed')) for e in before)),'afterRolloutBeforeRecovery':dict(Counter(str(e.get('status','upstreamUnconfirmed')) for e in after)),'hourly':[{'hourUtc':h,'category':c,'count':n} for (h,c),n in sorted(hourly.items())]}
          print(json.dumps({'kind':kind,'totalMatches':len(events),'last':events[-(15 if kind=='relay' else 10):],'timeline':timeline,'rawLogsEmitted':False}))
          PY
          )
          docker logs --timestamps --since 24h --tail 30000 st-michael-tg-relay 2>&1 | python3 -c "$classifier" relay
          docker logs --timestamps --since 24h --tail 30000 st-michael-api 2>&1 | python3 -c "$classifier" api
          # Read-only identity request. No getUpdates, webhook, or send method.
          docker exec -i st-michael-api node <<'JS'
          const allowed=new Set(['https://api.telegram.org','http://172.18.0.1:8081']);
          const base=String(process.env.TELEGRAM_API_BASE||'https://api.telegram.org').replace(/\/+$/,'');
          const token=(process.env.OPS_TELEGRAM_BOT_TOKEN||process.env.TELEGRAM_BOT_TOKEN||'').trim();
          if(!allowed.has(base))throw Error('UNEXPECTED_TELEGRAM_BASE');
          console.log('BOT_CONFIG='+JSON.stringify({relayConfigured:base.startsWith('http:'),tokenPresent:!!token,recipientCount:new Set(String(process.env.OPS_ALERT_CHAT_IDS||'').split(/[\s,;]+/).filter(Boolean)).size}));
          (async()=>{if(!token)return;try{const r=await fetch(base+'/bot'+token+'/getMe',{method:'GET',redirect:'error',signal:AbortSignal.timeout(15000)});const p=await r.json();console.log('BOT_IDENTITY='+JSON.stringify({httpStatus:r.status,ok:p.ok===true,expectedBot:p.result?.username==='brokerStMichaelbot',messagesSent:0}));}catch(e){const code=e?.cause?.code;console.log('BOT_IDENTITY='+JSON.stringify({ok:false,networkCode:/^[A-Z_]{3,40}$/.test(code||'')?code:'UNKNOWN',aborted:e?.name==='TimeoutError',messagesSent:0}));}})();
          JS
          REMOTE
