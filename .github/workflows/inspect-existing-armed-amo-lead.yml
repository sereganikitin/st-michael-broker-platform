name: Inspect or link one existing armed amo lead (no CRM writes)

# Fixed source-bound client/broker scope. Identity/inspect/history/certify are
# read-only. Only explicit link mode can CAS this one local row after fresh
# certificate/backup gates. No provider mutation, creation retry or lease change.
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [identity, inspect, history, certify, link]
        default: identity
        required: true
      expected_checkout_sha:
        type: string
        required: false
        description: Exact checkout SHA from the read-only identity report; empty requires live SHA
      link_confirmation:
        type: string
        required: false
        description: LINK_ONLY_32377125_PRESERVE_STATUS_ALLOW_ONLY_MISSING_MEMO
      backup_run_id:
        type: string
        required: false
      backup_sha256:
        type: string
        required: false
      certificate_run_id:
        type: string
        required: false
      certificate_sha256:
        type: string
        required: false
concurrency:
  group: production-deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout exact reviewed case inspector
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Attest production and inspect only the approved case
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          EXPECTED_SSH_FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
          PRODUCTION_PG_SYSTEM_IDENTIFIER: ${{ vars.PRODUCTION_PG_SYSTEM_IDENTIFIER }}
          PRODUCTION_MIN_BROKER_ROWS: ${{ vars.PRODUCTION_MIN_BROKER_ROWS }}
          IDENTITY_ONLY: ${{ inputs.mode == 'identity' && 'true' || 'false' }}
          EXPECTED_CHECKOUT_SHA: ${{ inputs.expected_checkout_sha }}
          HISTORY_ONLY: ${{ (inputs.mode == 'history' || inputs.mode == 'certify' || inputs.mode == 'link') && 'true' || 'false' }}
          LINK_MODE: ${{ inputs.mode == 'certify' && 'certify' || inputs.mode == 'link' && 'link' || '' }}
          LINK_CONFIRMATION: ${{ inputs.link_confirmation }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
          BACKUP_SHA256: ${{ inputs.backup_sha256 }}
          CERTIFICATE_RUN_ID: ${{ inputs.certificate_run_id }}
          CERTIFICATE_SHA256: ${{ inputs.certificate_sha256 }}
          EXECUTION_ACTOR: ${{ github.actor }}
          EXECUTION_ATTEMPT: ${{ github.run_attempt }}
          EXECUTION_RUN: ${{ github.run_id }}
        run: |
          set -eEuo pipefail
          stage=local_validation
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then printf "fixed_case_failed_stage=%s\nfixed_case_exit_code=%s\n" "$stage" "$rc" >&2; fi' EXIT
          set_stage() { stage=$1; printf 'fixed_case_stage=%s\n' "$stage"; }
          test "$EXPECTED_REPOSITORY" = sereganikitin/st-michael-broker-platform || exit 1
          test "$EXPECTED_REF" = refs/heads/master || exit 1
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || exit 1
          test -n "$SSH_HOST" -a -n "$SSH_USER" -a -n "$SSH_PRIVATE_KEY" -a -n "$DEPLOY_PATH" || exit 1
          case "$SSH_HOST" in ""|-*|*[[:space:]]*) exit 1;; esac
          [[ "$SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]{0,63}$ ]] || exit 1
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && test "$SSH_PORT" -ge 1 -a "$SSH_PORT" -le 65535 || exit 1
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || exit 1
          case "$DEPLOY_PATH/" in *"/../"*|*"/./"*|*"//"*) exit 1;; esac
          [[ "$EXPECTED_SSH_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || exit 1
          [[ "$PRODUCTION_PG_SYSTEM_IDENTIFIER" =~ ^[0-9]+$ ]] || exit 1
          [[ "$PRODUCTION_MIN_BROKER_ROWS" =~ ^[1-9][0-9]*$ ]] || exit 1
          for tool in curl gh jq node sha256sum timeout base64 ssh ssh-keyscan ssh-keygen; do command -v "$tool" >/dev/null || exit 1; done
          set_stage local_master_identity
          master_sha=$(gh api "/repos/$EXPECTED_REPOSITORY/git/ref/heads/master" --jq '.object.sha' 2>/dev/null) || exit 1
          test "$master_sha" = "$EXPECTED_SHA" || exit 1
          source_ci=$(gh api "/repos/$EXPECTED_REPOSITORY/actions/workflows/deploy.yml/runs?head_sha=$EXPECTED_SHA&status=completed&per_page=30" 2>/dev/null) || exit 1
          printf '%s' "$source_ci" | jq -e --arg sha "$EXPECTED_SHA" 'any(.workflow_runs[]; .head_sha == $sha and .event == "push" and .head_branch == "master" and .status == "completed" and .conclusion == "success" and .repository.full_name == "sereganikitin/st-michael-broker-platform" and .head_repository.full_name == .repository.full_name)' >/dev/null || exit 1
          backup_created_at=none
          if [ -n "$LINK_MODE" ]; then
            test "$EXECUTION_ACTOR" = mefremov888-ai && test "$EXECUTION_ATTEMPT" = 1
            test "$LINK_CONFIRMATION" = LINK_ONLY_32377125_PRESERVE_STATUS_ALLOW_ONLY_MISSING_MEMO
            [[ "$BACKUP_RUN_ID" =~ ^[1-9][0-9]{5,19}$ && "$BACKUP_SHA256" =~ ^[a-f0-9]{64}$ ]]
            fresh_backup=$(gh api "/repos/$EXPECTED_REPOSITORY/actions/runs/$BACKUP_RUN_ID" 2>/dev/null)
            printf '%s' "$fresh_backup" | jq -e --arg sha "$EXPECTED_SHA" '.head_sha == $sha and .head_branch == "master" and .run_attempt == 1 and .path == ".github/workflows/backup-production-loyalty-predeploy.yml" and .status == "completed" and .conclusion == "success" and .repository.full_name == "sereganikitin/st-michael-broker-platform" and .head_repository.full_name == .repository.full_name' >/dev/null
            backup_receipt=$(gh run view "$BACKUP_RUN_ID" --repo "$EXPECTED_REPOSITORY" --log 2>/dev/null | awk '$NF ~ /^backup_sha256=[0-9a-f]+$/ && length($NF)==78 {sub(/^backup_sha256=/,"",$NF); print $NF}')
            test "$backup_receipt" = "$BACKUP_SHA256"
            backup_created_at=$(printf '%s' "$fresh_backup" | jq -er '.created_at | select(test("^[0-9TZ:.-]+$"))')
            if [ "$LINK_MODE" = link ]; then
              [[ "$CERTIFICATE_RUN_ID" =~ ^[1-9][0-9]{5,19}$ && "$CERTIFICATE_SHA256" =~ ^[a-f0-9]{64}$ ]]
              certificate_run=$(gh api "/repos/$EXPECTED_REPOSITORY/actions/runs/$CERTIFICATE_RUN_ID" 2>/dev/null)
              printf '%s' "$certificate_run" | jq -e --arg sha "$EXPECTED_SHA" '.head_sha == $sha and .head_branch == "master" and .run_attempt == 1 and .path == ".github/workflows/inspect-existing-armed-amo-lead.yml" and .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success" and .repository.full_name == "sereganikitin/st-michael-broker-platform" and .head_repository.full_name == .repository.full_name' >/dev/null
            else CERTIFICATE_RUN_ID=none; CERTIFICATE_SHA256=none; fi
          else BACKUP_RUN_ID=none; BACKUP_SHA256=none; CERTIFICATE_RUN_ID=none; CERTIFICATE_SHA256=none; LINK_CONFIRMATION=none; fi
          if [ "$HISTORY_ONLY" = true ]; then
            history_run=$(gh api "/repos/$EXPECTED_REPOSITORY/actions/runs/38251486523" 2>/dev/null) || exit 1
            printf '%s' "$history_run" | jq -e '.head_sha == "c5fe9e89083f45c7df6c3bf3c09401d0452a9158" and .run_attempt == 1 and .path == ".github/workflows/backup-production-loyalty-predeploy.yml" and .status == "completed" and .conclusion == "success" and .repository.full_name == "sereganikitin/st-michael-broker-platform" and .head_repository.full_name == .repository.full_name' >/dev/null || exit 1
          fi
          set_stage local_https_health
          deployed_sha=$(curl --fail --silent --max-time 15 --proto '=https' --tlsv1.2 https://broker.stmichael.ru/api/health | jq -er '.deployedSha | select(type == "string" and test("^[0-9a-f]{40}$"))') || exit 1
          set_stage local_source_ancestry
          compare_status=$(gh api "/repos/$EXPECTED_REPOSITORY/compare/$deployed_sha...$EXPECTED_SHA" --jq '.status' 2>/dev/null) || exit 1
          case "$compare_status" in ahead|identical) ;; *) exit 1;; esac
          checkout_sha=${EXPECTED_CHECKOUT_SHA:-$deployed_sha}
          [[ "$checkout_sha" =~ ^[a-f0-9]{40}$ ]] || exit 1
          # Working-tree metadata may legitimately be ahead after TLS/ops-only
          # releases. Authenticate it independently; never call it live API code.
          for pair in "$deployed_sha...$checkout_sha" "$checkout_sha...$EXPECTED_SHA"; do
            status=$(gh api "/repos/$EXPECTED_REPOSITORY/compare/$pair" --jq '.status' 2>/dev/null) || exit 1
            case "$status" in ahead|identical) ;; *) exit 1;; esac
          done
          unset master_sha compare_status GH_TOKEN
          inspector_path=scripts/inspect-fixed-amo-fixation-case.js
          dependency_path=scripts/inspect-amo-fixation-lead-reconciliation.js
          history_path=scripts/fixed-amo-historical-agency-proof.js
          link_path=scripts/link-existing-fixed-amo-case.js
          for path in "$inspector_path" "$dependency_path" "$history_path" "$link_path"; do test -f "$path" -a ! -L "$path" || exit 1; done
          inspector_sha=$(sha256sum -- "$inspector_path" | awk '{print $1}')
          dependency_sha=$(sha256sum -- "$dependency_path" | awk '{print $1}')
          history_sha=$(sha256sum -- "$history_path" | awk '{print $1}')
          link_sha=$(sha256sum -- "$link_path" | awk '{print $1}')
          [[ "$inspector_sha" =~ ^[0-9a-f]{64}$ && "$dependency_sha" =~ ^[0-9a-f]{64}$ ]] || exit 1
          runner_temp=${RUNNER_TEMP:-/tmp}
          test -d "$runner_temp" -a ! -L "$runner_temp" || exit 1
          ssh_root=$(mktemp -d "$runner_temp/st-michael-fixed-case.XXXXXX")
          known_hosts="$ssh_root/known_hosts"
          private_key="$ssh_root/deploy-key"
          bundle_path="$ssh_root/reviewed-case.js"
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then printf "fixed_case_failed_stage=%s\nfixed_case_exit_code=%s\n" "$stage" "$rc" >&2; fi; rm -f -- "$known_hosts" "$private_key" "$bundle_path"; rmdir -- "$ssh_root" 2>/dev/null || true' EXIT
          umask 077
          set_stage local_hash_bound_bundle
          node - "$dependency_path" "$inspector_path" "$dependency_sha" "$inspector_sha" "$history_path" "$history_sha" "$link_path" "$link_sha" > "$bundle_path" <<'BUNDLE'
          const fs = require('node:fs');
          const { createHash } = require('node:crypto');
          const [dependencyPath, inspectorPath, dependencySha, inspectorSha, historyPath, historySha, linkPath, linkSha] = process.argv.slice(2);
          function source(path, hash) {
            const bytes = fs.readFileSync(path);
            if (bytes.length > 262144 || createHash('sha256').update(bytes).digest('hex') !== hash) throw new Error('Source binding refused');
            // A shebang is legal only at the beginning of a JS program;
            // comment it after authenticating the original dependency bytes.
            return bytes.toString('utf8').replace(/^#!([^\r\n]*)/, '//#!$1');
          }
          const dependency = source(dependencyPath, dependencySha);
          const inspector = source(inspectorPath, inspectorSha);
          const history = source(historyPath, historySha);
          const link = source(linkPath, linkSha);
          process.stdout.write(`"use strict";\nconst FIXED_CASE_LINK_SOURCE_SHA256=${JSON.stringify(linkSha)};\nconst FIXED_CASE_LINK_HELPERS=(()=>{const module={exports:{}};const exports=module.exports;\n${link}\nreturn module.exports;})();\nconst FIXED_CASE_DEPENDENCY_SOURCE_SHA256=${JSON.stringify(dependencySha)};\nconst FIXED_CASE_INSPECTOR_SOURCE_SHA256=${JSON.stringify(inspectorSha)};\nconst FIXED_CASE_HISTORY_SOURCE_SHA256=${JSON.stringify(historySha)};\nconst FIXED_CASE_HISTORICAL_AGENCY_HELPERS=(()=>{const module={exports:{}};const exports=module.exports;\n${history}\nreturn module.exports;})();\nconst FIXED_CASE_RECONCILIATION_HELPERS=(()=>{const module={exports:{}};const exports=module.exports;\n${dependency}\nreturn module.exports;})();\n${inspector}\n`);
          BUNDLE
          bundle_sha=$(sha256sum -- "$bundle_path" | awk '{print $1}')
          [[ "$bundle_sha" =~ ^[0-9a-f]{64}$ ]] || exit 1
          set_stage local_ssh_host_identity
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$private_key"
          chmod 600 "$private_key"
          unset SSH_PRIVATE_KEY
          timeout 15 ssh-keyscan -p "$SSH_PORT" -t ed25519 "$SSH_HOST" > "$known_hosts" 2>/dev/null
          chmod 600 "$known_hosts"
          fingerprints=$(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}' | sort -u)
          test "$fingerprints" = "$EXPECTED_SSH_FINGERPRINT" || exit 1
          set_stage local_pinned_ssh
          {
            cat <<'REMOTE_PREFIX'
          set -eEuo pipefail
          stage=remote_validation
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then printf "fixed_case_failed_stage=%s\nfixed_case_exit_code=%s\n" "$stage" "$rc" >&2; fi' EXIT
          set_stage() { stage=$1; printf 'fixed_case_stage=%s\n' "$stage"; }
          export LC_ALL=C GIT_OPTIONAL_LOCKS=0
          deploy_path=$1
          expected_deployed_sha=$2
          expected_system_identifier=$3
          minimum_broker_rows=$4
          expected_bundle_sha=$5
          expected_inspector_sha=$6
          expected_dependency_sha=$7
          identity_only=$8
          expected_checkout_sha=$9
          history_only=${10}; expected_history_sha=${11}
          link_mode=${12}; link_confirmation=${13}; source_sha=${14}; backup_run=${15}; backup_sha=${16}; backup_created=${17}; certificate_run=${18}; certificate_sha=${19}; run_id=${20}; link_sha=${21}; actor=${22}; run_attempt=${23}
          case "$link_mode" in none) link_mode="";; certify|link) ;; *) exit 1;; esac
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ && "$link_sha" =~ ^[a-f0-9]{64}$ && "$run_id" =~ ^[1-9][0-9]{5,19}$ ]]
          if [ -n "$link_mode" ]; then
            test "$actor" = mefremov888-ai && test "$run_attempt" = 1
            test "$link_confirmation" = LINK_ONLY_32377125_PRESERVE_STATUS_ALLOW_ONLY_MISSING_MEMO
            [[ "$backup_run" =~ ^[1-9][0-9]{5,19}$ && "$backup_sha" =~ ^[a-f0-9]{64}$ && "$backup_created" =~ ^[0-9TZ:.-]+$ ]]
          fi
          case "$history_only" in true|false) ;; *) exit 1;; esac
          [[ "$expected_history_sha" =~ ^[a-f0-9]{64}$ ]] || exit 1
          [[ "$expected_checkout_sha" =~ ^[a-f0-9]{40}$ ]] || exit 1
          case "$identity_only" in true|false) ;; *) exit 1;; esac
          for tool in awk base64 curl docker flock git jq readlink sha256sum stat timeout; do command -v "$tool" >/dev/null || exit 1; done
          [[ "$deploy_path" =~ ^/[A-Za-z0-9._/-]+$ ]] || exit 1
          case "$deploy_path/" in *"/../"*|*"/./"*|*"//"*) exit 1;; esac
          [[ "$expected_deployed_sha" =~ ^[0-9a-f]{40}$ && "$expected_system_identifier" =~ ^[0-9]+$ && "$minimum_broker_rows" =~ ^[1-9][0-9]*$ ]] || exit 1
          for hash in "$expected_bundle_sha" "$expected_inspector_sha" "$expected_dependency_sha"; do [[ "$hash" =~ ^[0-9a-f]{64}$ ]] || exit 1; done
          deploy_root=$(readlink -f -- "$deploy_path")
          test -n "$deploy_root" -a "$deploy_root" != / -a -d "$deploy_root" || exit 1
          set_stage remote_shared_lock
          lock_path=/tmp/st-michael-production-deploy.lock
          test -f "$lock_path" -a ! -L "$lock_path" || exit 1
          lock_identity=$(stat -Lc '%d:%i' -- "$lock_path")
          exec 9<"$lock_path"
          test "$(stat -Lc '%d:%i' -- /proc/$$/fd/9)" = "$lock_identity" || exit 1
          if [ "$link_mode" = link ]; then flock -x -n 9; else flock -s -n 9; fi || { echo 'production_lock_busy=true'; exit 1; }
          test "$(stat -Lc '%d:%i' -- "$lock_path")" = "$lock_identity" || exit 1
          set_stage remote_runtime_identity
          cd -- "$deploy_root"
          checkout=$(git rev-parse HEAD 2>/dev/null || true)
          [[ "$checkout" =~ ^[a-f0-9]{40}$ ]] || checkout=invalid
          root_matches=false; remote_matches=false; branch_matches=false; checkout_matches=false
          test "$(git rev-parse --show-toplevel 2>/dev/null || true)" = "$deploy_root" && root_matches=true
          test "$(git remote get-url origin 2>/dev/null || true)" = https://github.com/sereganikitin/st-michael-broker-platform.git && remote_matches=true
          test "$(git symbolic-ref --short HEAD 2>/dev/null || true)" = master && branch_matches=true
          test "$checkout" = "$expected_deployed_sha" && checkout_matches=true
          printf 'FIXED_CASE_RUNTIME_IDENTITY={"rootMatches":%s,"remoteMatches":%s,"branchMatches":%s,"checkoutMatchesLive":%s,"checkoutSha":"%s","liveSha":"%s","databaseRead":false,"crmRead":false,"writes":false}\n' "$root_matches" "$remote_matches" "$branch_matches" "$checkout_matches" "$checkout" "$expected_deployed_sha"
          host_unset=false; context_unset=false; default_context=false; trusted_socket=false; socket_present=false; privileged_engine=false
          test -z "${DOCKER_HOST:-}" && host_unset=true
          test -z "${DOCKER_CONTEXT:-}" && context_unset=true
          test "$(timeout 15 docker context show 2>/dev/null || true)" = default && default_context=true
          test "$(timeout 15 docker context inspect default --format '{{.Endpoints.docker.Host}}' 2>/dev/null || true)" = unix:///var/run/docker.sock && trusted_socket=true
          test -S /var/run/docker.sock && socket_present=true
          timeout 15 docker info --format '{{json .SecurityOptions}}' 2>/dev/null | jq -e 'type == "array" and all(.[]; type == "string" and (contains("rootless") | not))' >/dev/null && privileged_engine=true
          pg_project=$(timeout 15 docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' st-michael-postgres 2>/dev/null || true)
          project_valid=false; [[ "$pg_project" =~ ^[a-z0-9][a-z0-9_-]{0,62}$ ]] && project_valid=true
          service_states=""
          for item in api postgres redis; do
            running=false; project_matches=false; service_matches=false
            test "$(timeout 15 docker inspect --format '{{.State.Running}}' "st-michael-$item" 2>/dev/null || true)" = true && running=true
            test "$(timeout 15 docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "st-michael-$item" 2>/dev/null || true)" = "$pg_project" && project_matches=true
            test "$(timeout 15 docker inspect --format '{{ index .Config.Labels "com.docker.compose.service" }}' "st-michael-$item" 2>/dev/null || true)" = "$item" && service_matches=true
            service_states="${service_states}${service_states:+,}\"$item\":{\"running\":$running,\"projectMatches\":$project_matches,\"serviceMatches\":$service_matches}"
          done
          printf 'FIXED_CASE_DOCKER_IDENTITY={"hostOverrideUnset":%s,"contextOverrideUnset":%s,"defaultContext":%s,"trustedSocket":%s,"socketPresent":%s,"privilegedEngine":%s,"projectValid":%s,"services":{%s},"databaseRead":false,"crmRead":false,"writes":false}\n' "$host_unset" "$context_unset" "$default_context" "$trusted_socket" "$socket_present" "$privileged_engine" "$project_valid" "$service_states"
          port_busy=false; quiet_present=false
          test -z "$(ss -ltnH 'sport = :8082' 2>/dev/null || true)" || port_busy=true
          docker container inspect st-michael-telegram-quiet >/dev/null 2>&1 && quiet_present=true
          printf 'FIXED_CASE_QUIET_INFRA={"port8082Busy":%s,"quietContainerPresent":%s,"writes":false}\n' "$port_busy" "$quiet_present"
          alternate_port_busy=false
          test -z "$(ss -ltnH 'sport = :18082' 2>/dev/null || true)" || alternate_port_busy=true
          printf 'FIXED_CASE_QUIET_PORT={"port18082Busy":%s,"writes":false}\n' "$alternate_port_busy"
          if [ "$identity_only" = true ]; then exit 0; fi
          test "$(git rev-parse --show-toplevel)" = "$deploy_root" || exit 1
          test "$(git remote get-url origin)" = https://github.com/sereganikitin/st-michael-broker-platform.git || exit 1
          test "$(git symbolic-ref --short HEAD)" = master || exit 1
          test "$(git rev-parse HEAD)" = "$expected_checkout_sha" || exit 1
          test -z "${DOCKER_HOST:-}" -a -z "${DOCKER_CONTEXT:-}" || exit 1
          test "$(timeout 15 docker context show 2>/dev/null)" = default || exit 1
          test "$(timeout 15 docker context inspect default --format '{{.Endpoints.docker.Host}}' 2>/dev/null)" = unix:///var/run/docker.sock || exit 1
          test -S /var/run/docker.sock || exit 1
          security_options=$(timeout 15 docker info --format '{{json .SecurityOptions}}' 2>/dev/null)
          printf '%s' "$security_options" | jq -e 'type == "array" and all(.[]; type == "string" and (contains("rootless") | not))' >/dev/null || exit 1
          unset security_options
          project=$(timeout 15 docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' st-michael-postgres 2>/dev/null)
          [[ "$project" =~ ^[a-z0-9][a-z0-9_-]{0,62}$ ]] || exit 1
          for service in api postgres redis; do
            test "$(timeout 15 docker inspect --format '{{.State.Running}}' "st-michael-$service" 2>/dev/null)" = true || exit 1
            test "$(timeout 15 docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "st-michael-$service" 2>/dev/null)" = "$project" || exit 1
            test "$(timeout 15 docker inspect --format '{{ index .Config.Labels "com.docker.compose.service" }}' "st-michael-$service" 2>/dev/null)" = "$service" || exit 1
          done
          assert_health() {
            local sha
            sha=$(curl --fail --silent --max-time 15 --proto '=https' --tlsv1.2 https://broker.stmichael.ru/api/health | jq -er '.deployedSha | select(type == "string" and test("^[0-9a-f]{40}$"))') || return 1
            test "$sha" = "$expected_deployed_sha" || return 1
            test "$(timeout 15 docker exec st-michael-api sh -c 'printf %s "$GIT_SHA"' 2>/dev/null)" = "$expected_deployed_sha" || return 1
          }
          set_stage remote_https_health
          assert_health || exit 1
          set_stage remote_readonly_database
          database_metrics=$(timeout 20 docker exec st-michael-postgres psql -U postgres -d broker_platform --no-psqlrc -AtF '|' -v ON_ERROR_STOP=1 -c "BEGIN READ ONLY; SET LOCAL statement_timeout='5s'; SET LOCAL lock_timeout='1s'; SELECT system_identifier, (SELECT count(*) FROM public.brokers) FROM pg_control_system(); ROLLBACK;" 2>/dev/null | awk -F'|' 'NF==2 && $1 ~ /^[0-9]+$/ {print}')
          [[ "$database_metrics" =~ ^[0-9]+\|[0-9]+$ ]] || exit 1
          IFS='|' read -r system_identifier broker_rows <<< "$database_metrics"
          test "$system_identifier" = "$expected_system_identifier" && test "$broker_rows" -ge "$minimum_broker_rows" || exit 1
          unset database_metrics system_identifier broker_rows
          if [ -n "$link_mode" ]; then
            set_stage remote_fresh_link_backup_attestation
            fresh_backup="/var/backups/stmichael/loyalty-predeploy/loyalty-predeploy-$source_sha-run$backup_run-attempt1.dump"
            test -f "$fresh_backup" -a ! -L "$fresh_backup"
            test "$(readlink -f "$fresh_backup")" = "$fresh_backup"
            test "$(stat -c '%a:%u' "$fresh_backup")" = "600:$(id -u)"
            test "$(sha256sum "$fresh_backup" | cut -d' ' -f1)" = "$backup_sha"
            certificate_root=/var/lib/stmichael/fixed-amo-link/certificates
