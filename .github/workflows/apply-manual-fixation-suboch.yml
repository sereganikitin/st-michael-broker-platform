name: Apply manual fixation (Субоч, одноразово)

# 2026-09-10: разовая операция по обращению — имя для работы карточке
# брокера с номером +7 925 221 21 77 и заявка на клиента со статусом
# «уникален». Карточку в amoCRM создаёт штатная синхронизация.
# Боевой режим требует dry_run=false И confirm_apply=true.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (только отчёт)'
        required: true
        default: true
        type: boolean
      confirm_apply:
        description: 'Подтверждаю запись (нужно вместе с dry_run=false)'
        required: false
        default: false
        type: boolean

concurrency:
  group: apply-manual-fixation
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH and run
        uses: appleboy/ssh-action@v1.0.3
        env:
          DRY_INPUT: ${{ inputs.dry_run }}
          CONFIRM_INPUT: ${{ inputs.confirm_apply }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 8m
          envs: DRY_INPUT,CONFIRM_INPUT
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin master
            git show origin/master:scripts/apply-manual-fixation-suboch.js > /tmp/apply-manual-fixation-suboch.js
            docker cp /tmp/apply-manual-fixation-suboch.js st-michael-api:/app/scripts/apply-manual-fixation-suboch.js
            DRY=1
            if [ "$DRY_INPUT" = "false" ]; then
              if [ "$CONFIRM_INPUT" != "true" ]; then echo "dry_run=false требует confirm_apply=true"; exit 1; fi
              DRY=0
            fi
            docker compose exec -T -e DRY_RUN=$DRY api node /app/scripts/apply-manual-fixation-suboch.js
