name: Add confirmed vishstmichael technical recipient (same image)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        type: string
        required: true
        description: ADD_VISH_ONLY_22_09_SAME_IMAGE
      public_key:
        type: string
        required: true
        description: Base64 RSA public key for private recipient-secret synchronization
concurrency:
  group: production-deploy
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify source, contracts and authorized narrow operation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SOURCE: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          ATTEMPT: ${{ github.run_attempt }}
          CONFIRMATION: ${{ inputs.confirmation }}
          PUBLIC_KEY: ${{ inputs.public_key }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          PIN: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
          DEPLOY: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          test "$REPO" = sereganikitin/st-michael-broker-platform
          test "$REF" = refs/heads/master
          test "$ACTOR" = mefremov888-ai
          test "$ATTEMPT" = 1
          test "$CONFIRMATION" = ADD_VISH_ONLY_22_09_SAME_IMAGE
          [[ "$PUBLIC_KEY" =~ ^[A-Za-z0-9+/=]{600,1400}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test "$(gh api /repos/$REPO/git/ref/heads/master --jq '.object.sha')" = "$SOURCE"
          gh api "/repos/$REPO/actions/workflows/deploy.yml/runs?head_sha=$SOURCE&status=completed&per_page=30" | jq -e --arg sha "$SOURCE" 'any(.workflow_runs[]; .head_sha==$sha and .event=="push" and .conclusion=="success")' >/dev/null
          node --test ops/telegram-quiet-hours.test.js ops/telegram-quiet-gateway.test.js scripts/inspect-vladimir-telegram.test.cjs
          python3 scripts/install-vish-recipient.test.py
          [[ "$PIN" =~ ^SHA256:[A-Za-z0-9+/]{43}$ && "$SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]{0,63}$ && "$PORT" =~ ^[0-9]{1,5}$ ]]
          case "$HOST" in ''|-*|*[[:space:]]*) exit 1;; esac
          [[ "$DEPLOY" =~ ^/[A-Za-z0-9._/-]+$ ]]
          case "$DEPLOY/" in *'/../'*|*'/./'*|*'//'*) exit 1;; esac
          work=$(mktemp -d); umask 077
          trap 'rm -f -- "$work/key" "$work/hosts" "$work/payload.tar"; rmdir -- "$work"' EXIT
          printf '%s\n' "$KEY" > "$work/key"; chmod 600 "$work/key"; unset KEY
          timeout 15 ssh-keyscan -p "$PORT" -t ed25519 "$HOST" > "$work/hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$work/hosts" -E sha256 | awk '{print $2}' | sort -u)" = "$PIN"
          tar -cf "$work/payload.tar" ops/telegram-quiet-hours.js ops/telegram-quiet-gateway.js scripts/prepare-vish-recipient.cjs scripts/install-vish-recipient.py
          digest=$(sha256sum "$work/payload.tar" | cut -d' ' -f1)
          {
            cat <<'REMOTE'
          set -euo pipefail
          export LC_ALL=C GIT_OPTIONAL_LOCKS=0
          root=$(readlink -f "$1"); source=$2; expected=$3; public_key=$4
          test "$root" != / -a -d "$root"; cd "$root"
          test "$(git rev-parse --show-toplevel)" = "$root"
          test "$(git remote get-url origin)" = https://github.com/sereganikitin/st-michael-broker-platform.git
          test -f /tmp/st-michael-production-deploy.lock -a ! -L /tmp/st-michael-production-deploy.lock
          exec 9</tmp/st-michael-production-deploy.lock; flock -x -n 9
          test "$(docker context show)" = default
          test "$(docker context inspect default --format '{{.Endpoints.docker.Host}}')" = unix:///var/run/docker.sock
          test -z "${DOCKER_HOST:-}" -a -z "${DOCKER_CONTEXT:-}"
          work=$(mktemp -d /tmp/stm-vish-install.XXXXXX); chmod 700 "$work"
          trap 'rm -f -- "$work/payload.tar" "$work/recipient-public.pem" "$work/ops/telegram-quiet-hours.js" "$work/ops/telegram-quiet-gateway.js" "$work/scripts/prepare-vish-recipient.cjs" "$work/scripts/install-vish-recipient.py"; rmdir -- "$work/ops" "$work/scripts" "$work" 2>/dev/null || true' EXIT
          base64 -d > "$work/payload.tar" <<'ARCHIVE'
          REMOTE
            base64 -w 0 "$work/payload.tar"
            printf '\nARCHIVE\n'
            cat <<'REMOTE'
          test "$(sha256sum "$work/payload.tar" | cut -d' ' -f1)" = "$expected"
          test "$(tar -tf "$work/payload.tar")" = $'ops/telegram-quiet-hours.js\nops/telegram-quiet-gateway.js\nscripts/prepare-vish-recipient.cjs\nscripts/install-vish-recipient.py'
          tar -xf "$work/payload.tar" -C "$work"
          python3 "$work/scripts/install-vish-recipient.py" "$work" "$source" "$public_key"
          REMOTE
          } | timeout 10m ssh -T -i "$work/key" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/hosts" -o ConnectTimeout=15 "$SSH_USER@$HOST" "bash -s -- '$DEPLOY' '$SOURCE' '$digest' '$PUBLIC_KEY'"
