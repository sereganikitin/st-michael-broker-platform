name: Refresh agency profiles through deployed HTTP API
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [dry-run, apply]
        default: dry-run
        required: true
      confirm_apply:
        type: boolean
        default: false
      expected_deployed_sha:
        type: string
        required: true
concurrency:
  group: production-deploy
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate reviewed master and inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_deployed_sha }}
          MODE: ${{ inputs.mode }}
          CONFIRM_APPLY: ${{ inputs.confirm_apply }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$SOURCE_REPOSITORY" = sereganikitin/st-michael-broker-platform
          test "$SOURCE_REF" = refs/heads/master
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          [[ "$MODE" = dry-run || "$MODE" = apply ]]
          if [ "$MODE" = apply ]; then test "$CONFIRM_APPLY" = true; fi
          master_sha=$(gh api repos/sereganikitin/st-michael-broker-platform/git/ref/heads/master --jq '.object.sha')
          test "$master_sha" = "$SOURCE_SHA"
          compare_status=$(gh api "repos/sereganikitin/st-michael-broker-platform/compare/$EXPECTED_SHA...$SOURCE_SHA" --jq '.status')
          [[ "$compare_status" = ahead || "$compare_status" = identical ]]
          git merge-base --is-ancestor "$EXPECTED_SHA" "$SOURCE_SHA"
          git diff --exit-code "$EXPECTED_SHA" "$SOURCE_SHA" -- apps/api packages/database packages/integrations packages/shared package.json package-lock.json turbo.json > /dev/null
          ci_runs=$(gh api --method GET repos/sereganikitin/st-michael-broker-platform/actions/workflows/deploy.yml/runs -f head_sha="$SOURCE_SHA" -f status=completed -f per_page=100)
          ci_run=$(printf '%s' "$ci_runs" | jq -er --arg sha "$SOURCE_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "master" and .conclusion == "success" and .repository.full_name == "sereganikitin/st-michael-broker-platform" and .head_repository.full_name == "sereganikitin/st-michael-broker-platform")] | sort_by(.id) | last.id | select(type == "number")')
          ci_jobs=$(gh api --paginate "repos/sereganikitin/st-michael-broker-platform/actions/runs/$ci_run/jobs?per_page=100")
          printf '%s' "$ci_jobs" | jq -se 'any(.[] | .jobs[]; .name == "Build and test release commit" and .conclusion == "success")' > /dev/null
          unset ci_runs ci_jobs
          node --test scripts/refresh-agency-profiles.test.cjs
          test "$(git show "$SOURCE_SHA:scripts/refresh-agency-profiles.cjs" | sha256sum | cut -d' ' -f1)" = "$(sha256sum scripts/refresh-agency-profiles.cjs | cut -d' ' -f1)"
      - name: Stream reviewed refresh into existing API container
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          EXPECTED_SSH_FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          EXPECTED_SHA: ${{ inputs.expected_deployed_sha }}
          SOURCE_SHA: ${{ github.sha }}
          MODE: ${{ inputs.mode }}
          CONFIRM_APPLY: ${{ inputs.confirm_apply }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" -a -n "$SSH_USER" -a -n "$SSH_PRIVATE_KEY" -a -n "$DEPLOY_PATH"
          case "$SSH_HOST" in ""|-*|*[[:space:]]*) exit 1;; esac
          [[ "$SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]{0,63}$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && test "$SSH_PORT" -ge 1 -a "$SSH_PORT" -le 65535
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          case "$DEPLOY_PATH/" in *"/../"*|*"/./"*|*"//"*) exit 1;; esac
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SSH_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]
          [[ "$MODE" = dry-run || "$MODE" = apply ]]
          [[ "$CONFIRM_APPLY" = false || "$CONFIRM_APPLY" = true ]]
          if [ "$MODE" = apply ]; then test "$CONFIRM_APPLY" = true; fi
          master_sha=$(gh api repos/sereganikitin/st-michael-broker-platform/git/ref/heads/master --jq '.object.sha')
          test "$master_sha" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$EXPECTED_SHA" "$SOURCE_SHA"
          git diff --exit-code "$EXPECTED_SHA" "$SOURCE_SHA" -- apps/api packages/database packages/integrations packages/shared package.json package-lock.json turbo.json > /dev/null
          backup_completed_at=none
          backup_deployed_sha=none
          if [ "$MODE" = apply ]; then
            backup_runs=$(gh api --method GET repos/sereganikitin/st-michael-broker-platform/actions/workflows/backup-production-loyalty-predeploy.yml/runs -f head_sha="$EXPECTED_SHA" -f event=workflow_dispatch -f status=completed -f per_page=100)
            backup_completed_at=$(printf '%s' "$backup_runs" | jq -er --arg sha "$EXPECTED_SHA" --argjson now "$(date +%s)" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "master" and .event == "workflow_dispatch" and .conclusion == "success" and .repository.full_name == "sereganikitin/st-michael-broker-platform" and .head_repository.full_name == "sereganikitin/st-michael-broker-platform" and ((.updated_at | fromdateiso8601) <= $now) and ($now - (.updated_at | fromdateiso8601) < 21600))] | sort_by(.updated_at) | last.updated_at | select(type == "string")')
            [[ "$backup_completed_at" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
            backup_deployed_sha="$EXPECTED_SHA"
            unset backup_runs
          fi
          script_hash=$(sha256sum scripts/refresh-agency-profiles.cjs | cut -d' ' -f1)
          [[ "$script_hash" =~ ^[0-9a-f]{64}$ ]]
          test "$(git show "$SOURCE_SHA:scripts/refresh-agency-profiles.cjs" | sha256sum | cut -d' ' -f1)" = "$script_hash"
          root=$(mktemp -d)
          known_hosts="$root/known_hosts"
          private_key="$root/deploy-key"
          trap 'rm -f -- "$known_hosts" "$private_key"; rmdir -- "$root" 2>/dev/null || true' EXIT
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$private_key"
          chmod 600 "$private_key"
          timeout 15 ssh-keyscan -p "$SSH_PORT" -t ed25519 "$SSH_HOST" > "$known_hosts" 2>/dev/null
          mapfile -t fingerprints < <(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}' | sort -u)
          test "${#fingerprints[@]}" -eq 1
          test "${fingerprints[0]}" = "$EXPECTED_SSH_FINGERPRINT"
          remote_command=$(cat <<'REMOTE'
          set -euo pipefail
          deploy_path=$1
          expected_sha=$2
          mode=$3
          confirm_apply=$4
          source_sha=$5
          expected_script_hash=$6
          backup_completed_at=$7
          backup_deployed_sha=$8
          [[ "$deploy_path" =~ ^/[A-Za-z0-9._/-]+$ && "$expected_sha" =~ ^[0-9a-f]{40}$ ]]
          case "$deploy_path/" in *"/../"*|*"/./"*|*"//"*) exit 1;; esac
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ && "$expected_script_hash" =~ ^[0-9a-f]{64}$ ]]
          [[ "$mode" = dry-run || "$mode" = apply ]]
          [[ "$confirm_apply" = false || "$confirm_apply" = true ]]
          if [ "$mode" = apply ]; then test "$confirm_apply" = true; fi
          deploy_root=$(readlink -f -- "$deploy_path")
          test -n "$deploy_root" -a "$deploy_root" != / -a -d "$deploy_root"
          lock_path=/tmp/st-michael-production-deploy.lock
          test -f "$lock_path" -a ! -L "$lock_path"
          lock_identity=$(stat -Lc '%d:%i' -- "$lock_path")
          exec 9<"$lock_path"
          test "$(stat -Lc '%d:%i' -- /proc/$$/fd/9)" = "$lock_identity"
          flock -n 9 || { echo production_lock_busy=true; exit 1; }
          test "$(stat -Lc '%d:%i' -- "$lock_path")" = "$lock_identity"
          cd -- "$deploy_root"
          test "$(git rev-parse --show-toplevel)" = "$deploy_root"
          test "$(git remote get-url origin)" = https://github.com/sereganikitin/st-michael-broker-platform.git
          test "$(git symbolic-ref --short HEAD)" = master
          test "$(git rev-parse HEAD)" = "$expected_sha"
          test -z "${DOCKER_HOST:-}" -a -z "${DOCKER_CONTEXT:-}"
          test "$(timeout 15 docker context show)" = default
          test "$(timeout 15 docker context inspect default --format '{{.Endpoints.docker.Host}}')" = unix:///var/run/docker.sock
          test -S /var/run/docker.sock
          test "$(timeout 15 docker inspect --format '{{.State.Running}}' st-michael-api)" = true
          test "$(timeout 15 docker inspect --format '{{ index .Config.Labels "com.docker.compose.service" }}' st-michael-api)" = api
          test "$(timeout 15 docker exec st-michael-api sh -c 'printf %s "$GIT_SHA"')" = "$expected_sha"
          file_runner=$(cat <<'RUN_REVIEWED_FILE'
          set -eu
          for required_tool in mktemp sha256sum node head wc rm; do
            command -v "$required_tool" >/dev/null || exit 1
          done
          umask 077
          runner_file=$(mktemp /app/scripts/.agency-refresh.XXXXXX)
          trap 'rm -f -- "$runner_file"' EXIT HUP INT TERM
          case "$runner_file" in /app/scripts/.agency-refresh.*) ;; *) exit 1;; esac
          test -f "$runner_file" -a ! -L "$runner_file"
          head -c 1048577 > "$runner_file"
          if [ "$(wc -c < "$runner_file")" -gt 1048576 ]; then
            printf '%s\n' '{"agencyProfileRefresh":{"status":"FAILED","code":"SOURCE_SIZE_INVALID"}}' >&2
            exit 1
          fi
          actual_hash=$(sha256sum "$runner_file")
          actual_hash=${actual_hash%% *}
          if [ "$actual_hash" != "$REFRESH_EXPECTED_SCRIPT_HASH" ]; then
            printf '%s\n' '{"agencyProfileRefresh":{"status":"FAILED","code":"SOURCE_HASH_MISMATCH"}}' >&2
            exit 1
          fi
          node "$runner_file"
          RUN_REVIEWED_FILE
          )
          export REFRESH_EXPECTED_SCRIPT_HASH="$expected_script_hash"
          timeout 31m docker exec -i -e EXPECTED_DEPLOYED_SHA="$expected_sha" -e MODE="$mode" -e CONFIRM_APPLY="$confirm_apply" -e REFRESH_SOURCE_SHA="$source_sha" -e REFRESH_EXPECTED_SCRIPT_HASH -e REFRESH_BACKUP_COMPLETED_AT="$backup_completed_at" -e REFRESH_BACKUP_DEPLOYED_SHA="$backup_deployed_sha" st-michael-api sh -c "$file_runner"
          test "$(git rev-parse HEAD)" = "$expected_sha"
          test "$(stat -Lc '%d:%i' -- "$lock_path")" = "$lock_identity"
          test "$(timeout 15 docker exec st-michael-api sh -c 'printf %s "$GIT_SHA"')" = "$expected_sha"
          REMOTE
          )
          printf -v quoted_remote '%q' "$remote_command"
          cat scripts/refresh-agency-profiles.cjs | timeout --foreground 32m ssh -i "$private_key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o NumberOfPasswordPrompts=0 \
            -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "${SSH_USER}@${SSH_HOST}" "bash -c $quoted_remote -- '$DEPLOY_PATH' '$EXPECTED_SHA' '$MODE' '$CONFIRM_APPLY' '$SOURCE_SHA' '$script_hash' '$backup_completed_at' '$backup_deployed_sha'"
