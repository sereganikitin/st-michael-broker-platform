name: Initialize absent production operation lock (guarded)

# The sole possible server mutation is O_EXCL creation of the absent, empty,
# operation-owned /tmp/st-michael-production-deploy.lock with mode 0600.
# Existing paths are never replaced, truncated, chmod/chowned or deleted.
on:
  workflow_dispatch:
    inputs:
      confirm_initialize:
        description: Confirm creation of the absent operation lock only
        required: true
        default: false
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - name: Checkout exact reviewed bootstrap
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Attest host and initialize one absent lock
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          EXPECTED_SSH_FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
          PRODUCTION_PG_SYSTEM_IDENTIFIER: ${{ vars.PRODUCTION_PG_SYSTEM_IDENTIFIER }}
          PRODUCTION_MIN_BROKER_ROWS: ${{ vars.PRODUCTION_MIN_BROKER_ROWS }}
        run: |
          set -eEuo pipefail
          stage=local_confirmation
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then printf "lock_bootstrap_failed_stage=%s\nlock_bootstrap_exit_code=%s\n" "$stage" "$rc" >&2; fi' EXIT
          set_stage() { stage=$1; printf 'lock_bootstrap_stage=%s\n' "$stage"; }
          set_stage local_confirmation
          jq -e '.inputs.confirm_initialize == true or .inputs.confirm_initialize == "true"' "$GITHUB_EVENT_PATH" >/dev/null || { echo 'lock_bootstrap_guard_failed=explicit_confirmation'; exit 1; }
          set_stage local_validation
          test "$EXPECTED_REPOSITORY" = sereganikitin/st-michael-broker-platform || exit 1
          test "$EXPECTED_REF" = refs/heads/master || exit 1
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || exit 1
          test -n "$SSH_HOST" -a -n "$SSH_USER" -a -n "$SSH_PRIVATE_KEY" -a -n "$DEPLOY_PATH" || exit 1
          case "$SSH_HOST" in ""|-*|*[[:space:]]*) exit 1;; esac
          [[ "$SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]{0,63}$ ]] || exit 1
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && test "$SSH_PORT" -ge 1 -a "$SSH_PORT" -le 65535 || exit 1
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || exit 1
          case "$DEPLOY_PATH/" in *"/../"*|*"/./"*|*"//"*) exit 1;; esac
          [[ "$EXPECTED_SSH_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || exit 1
          [[ "$PRODUCTION_PG_SYSTEM_IDENTIFIER" =~ ^[0-9]+$ && "$PRODUCTION_MIN_BROKER_ROWS" =~ ^[1-9][0-9]*$ ]] || exit 1
          set_stage local_master_identity
          master_sha=$(gh api "/repos/$EXPECTED_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          test "$master_sha" = "$EXPECTED_SHA" || exit 1
          set_stage local_https_health
          deployed_sha=$(curl --fail --silent --show-error --max-time 15 --proto '=https' --tlsv1.2 https://broker.stmichael.ru/api/health | jq -er '.deployedSha | select(type == "string" and test("^[0-9a-f]{40}$"))')
          set_stage local_source_ancestry
          compare_status=$(gh api "/repos/$EXPECTED_REPOSITORY/compare/$deployed_sha...$EXPECTED_SHA" --jq '.status')
          case "$compare_status" in ahead|identical) ;; *) exit 1;; esac
          unset master_sha compare_status GH_TOKEN
          helper_path=scripts/initialize-production-operation-lock.py
          test -f "$helper_path" -a ! -L "$helper_path" || exit 1
          helper_hash=$(sha256sum -- "$helper_path" | awk '{print $1}')
          helper_base64=$(base64 -w 0 -- "$helper_path")
          [[ "$helper_hash" =~ ^[0-9a-f]{64}$ && "$helper_base64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]] && test "${#helper_base64}" -le 65536 || exit 1
          set_stage local_ssh_host_identity
          ssh_root=$(mktemp -d)
          known_hosts="$ssh_root/known_hosts"
          private_key="$ssh_root/deploy-key"
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then printf "lock_bootstrap_failed_stage=%s\nlock_bootstrap_exit_code=%s\n" "$stage" "$rc" >&2; fi; rm -f -- "$known_hosts" "$private_key"; rmdir -- "$ssh_root" 2>/dev/null || true' EXIT
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$private_key"
          chmod 600 "$private_key"
          timeout 15 ssh-keyscan -p "$SSH_PORT" -t ed25519 "$SSH_HOST" > "$known_hosts" 2>/dev/null
          chmod 600 "$known_hosts"
          mapfile -t fingerprints < <(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}' | sort -u)
          test "${#fingerprints[@]}" -eq 1 && test "${fingerprints[0]}" = "$EXPECTED_SSH_FINGERPRINT" || exit 1
          set_stage local_pinned_ssh
          timeout --foreground 5m ssh -T -i "$private_key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o NumberOfPasswordPrompts=0 \
            -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "${SSH_USER}@${SSH_HOST}" \
            "bash -s -- '$DEPLOY_PATH' '$deployed_sha' '$PRODUCTION_PG_SYSTEM_IDENTIFIER' '$PRODUCTION_MIN_BROKER_ROWS' '$helper_hash' '$helper_base64'" <<'REMOTE'
          set -eEuo pipefail
          export LC_ALL=C GIT_OPTIONAL_LOCKS=0
          stage=remote_validation
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then printf "lock_bootstrap_failed_stage=%s\nlock_bootstrap_exit_code=%s\n" "$stage" "$rc" >&2; fi' EXIT
          set_stage() { stage=$1; printf 'lock_bootstrap_stage=%s\n' "$stage"; }
          set_stage remote_validation
          deploy_path=$1
          expected_deployed_sha=$2
          expected_system_identifier=$3
          minimum_broker_rows=$4
          helper_hash=$5
          helper_base64=$6
          for tool in awk base64 curl docker flock git id jq python3 readlink sha256sum stat sudo timeout; do command -v "$tool" >/dev/null || exit 1; done
          [[ "$deploy_path" =~ ^/[A-Za-z0-9._/-]+$ ]] || exit 1
          case "$deploy_path/" in *"/../"*|*"/./"*|*"//"*) exit 1;; esac
          [[ "$expected_deployed_sha" =~ ^[0-9a-f]{40}$ && "$expected_system_identifier" =~ ^[0-9]+$ && "$minimum_broker_rows" =~ ^[1-9][0-9]*$ && "$helper_hash" =~ ^[0-9a-f]{64}$ && "$helper_base64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]] && test "${#helper_base64}" -le 65536 || exit 1
          test "$(printf '%s' "$helper_base64" | base64 --decode | sha256sum | awk '{print $1}')" = "$helper_hash" || exit 1
          deploy_root=$(readlink -f -- "$deploy_path")
          test -n "$deploy_root" -a "$deploy_root" != / -a -d "$deploy_root" || exit 1
          cd -- "$deploy_root"
          test "$(git rev-parse --show-toplevel)" = "$deploy_root" || exit 1
          test "$(git remote get-url origin)" = https://github.com/sereganikitin/st-michael-broker-platform.git || exit 1
          test "$(git symbolic-ref --short HEAD)" = master || exit 1
          test "$(git rev-parse HEAD)" = "$expected_deployed_sha" || exit 1
          test -z "${DOCKER_HOST:-}" -a -z "${DOCKER_CONTEXT:-}" || exit 1
          test "$(timeout 15 docker context show)" = default || exit 1
          endpoint=$(timeout 15 docker context inspect default --format '{{.Endpoints.docker.Host}}')
          case "$endpoint" in unix:///*) ;; *) exit 1;; esac
          assert_health() {
            local sha
            sha=$(curl --fail --silent --show-error --max-time 15 --proto '=https' --tlsv1.2 https://broker.stmichael.ru/api/health | jq -er '.deployedSha | select(type == "string" and test("^[0-9a-f]{40}$"))') || return 1
            test "$sha" = "$expected_deployed_sha" || return 1
            test "$(timeout 15 docker inspect --format '{{.State.Running}}' st-michael-api)" = true || return 1
            test "$(timeout 15 docker exec st-michael-api sh -c 'printf %s "$GIT_SHA"')" = "$expected_deployed_sha" || return 1
          }
          set_stage remote_https_and_database_identity
          assert_health || { echo 'lock_bootstrap_guard_failed=https_health'; exit 1; }
          api_started_before=$(timeout 15 docker inspect --format '{{.State.StartedAt}}' st-michael-api)
          database_metrics=$(timeout 20 docker exec st-michael-postgres psql -U postgres -d broker_platform --no-psqlrc -AtF '|' -v ON_ERROR_STOP=1 -c "BEGIN READ ONLY; SET LOCAL statement_timeout='5s'; SET LOCAL lock_timeout='1s'; SELECT system_identifier, (SELECT count(*) FROM public.brokers) FROM pg_control_system(); ROLLBACK;" | awk -F'|' 'NF==2 && $1 ~ /^[0-9]+$/ {print}')
          [[ "$database_metrics" =~ ^[0-9]+\|[0-9]+$ ]] || exit 1
          IFS='|' read -r system_identifier broker_rows <<< "$database_metrics"
          test "$system_identifier" = "$expected_system_identifier" && test "$broker_rows" -ge "$minimum_broker_rows" || exit 1
          operation_uid=$(id -u)
          [[ "$operation_uid" =~ ^(0|[1-9][0-9]{0,9})$ ]] || exit 1
          set_stage remote_privileged_proc_audit_and_lock_initialization
          helper_output=$(printf '%s' "$helper_base64" | base64 --decode | timeout 90 sudo -n python3 -B - --initialize "$operation_uid" 2>/dev/null) || { printf '%s\n' "$helper_output"; echo 'lock_bootstrap_guard_failed=privileged_lock_audit'; exit 1; }
          printf '%s\n' "$helper_output"
          expected_inode=$(printf '%s\n' "$helper_output" | jq -ser 'map(select(.lock_certified == true)) | select(length == 1) | .[0] | select(.lock_device | type == "number") | select(.lock_inode | type == "number") | [.lock_device,.lock_inode] | join(":")')
          [[ "$expected_inode" =~ ^[0-9]+:[1-9][0-9]*$ ]] || exit 1
          set_stage remote_final_inode_and_runtime_attestation
          lock_path=/tmp/st-michael-production-deploy.lock
          test -f "$lock_path" -a ! -L "$lock_path" || exit 1
          test "$(stat -c '%u:%a:%h:%s' -- "$lock_path")" = "$operation_uid:600:1:0" || exit 1
          test "$(stat -c '%d:%i' -- "$lock_path")" = "$expected_inode" || exit 1
          exec 9<"$lock_path"
          flock -n 9 || { echo 'lock_bootstrap_guard_failed=final_lock_busy'; exit 1; }
          test "$(stat -Lc '%d:%i' -- /proc/$$/fd/9)" = "$expected_inode" || exit 1
          assert_health || exit 1
          test "$(timeout 15 docker inspect --format '{{.State.StartedAt}}' st-michael-api)" = "$api_started_before" || exit 1
          test "$(git rev-parse HEAD)" = "$expected_deployed_sha" || exit 1
          test -f "$lock_path" -a ! -L "$lock_path" || exit 1
          test "$(stat -c '%d:%i:%u:%a:%h:%s' -- "$lock_path")" = "$expected_inode:$operation_uid:600:1:0" || exit 1
          echo 'operation_lock_finally_certified=true'
          echo 'runtime_sha_and_started_at_unchanged=true'
          echo 'images_services_database_materials_backups_untouched=true'
          REMOTE
