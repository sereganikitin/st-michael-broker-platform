name: Inspect summary diff (read-only)

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Скрипт из scripts/ (только inspect-*.js)'
        required: false
        default: 'inspect-summary-diff.js'
        type: string

concurrency:
  group: inspect-summary-diff
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: SSH and inspect
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 35m
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin master
            SCRIPT="${{ inputs.script }}"
            echo "$SCRIPT" | grep -qE '^inspect-[a-z0-9-]+\.js$' || { echo "недопустимое имя скрипта"; exit 2; }
            git show "origin/master:scripts/$SCRIPT" > "/tmp/$SCRIPT"
            docker cp "/tmp/$SCRIPT" "st-michael-api:/app/scripts/$SCRIPT"
            docker compose exec -T api node "/app/scripts/$SCRIPT"
