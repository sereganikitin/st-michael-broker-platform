name: Send note to ops Telegram

# 2026-09-04: отправка произвольной текстовой заметки в ops-чат Телеграма
# (тот же чат, куда ходят алерты, бот техподдержки). Нужно, чтобы Claude мог
# присылать пользователю подборки на проверку (например, сомнительные пары
# сшивки сделок) прямо в Телеграм. Текст передаётся base64 (UTF-8), длинный
# режется по абзацам на сообщения ≤3900 символов.

on:
  workflow_dispatch:
    inputs:
      text_b64:
        description: base64 (UTF-8) текста заметки
        required: true
        type: string

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decode and send in chunks
        env:
          TEXT_B64: ${{ inputs.text_b64 }}
          TG_TOKEN: ${{ secrets.OPS_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.OPS_ALERT_CHAT_ID }}
        run: |
          set -euo pipefail
          test -n "$TG_TOKEN" || { echo "нет токена бота"; exit 1; }
          test -n "$TG_CHAT" || { echo "нет OPS_ALERT_CHAT_ID"; exit 1; }
          python3 - <<'PY'
          import base64, json, os, time, urllib.request, urllib.parse

          text = base64.b64decode(os.environ["TEXT_B64"]).decode("utf-8")
          token, chat = os.environ["TG_TOKEN"], os.environ["TG_CHAT"]

          chunks, cur = [], ""
          for para in text.split("\n\n"):
              cand = (cur + "\n\n" + para).strip() if cur else para
              if len(cand) > 3900 and cur:
                  chunks.append(cur)
                  cur = para
              else:
                  cur = cand
          if cur:
              chunks.append(cur)

          for i, chunk in enumerate(chunks):
              data = urllib.parse.urlencode({"chat_id": chat, "text": chunk}).encode()
              req = urllib.request.Request(
                  f"https://broker.stmichael.ru/api/ops-telegram/bot{token}/sendMessage", data=data,
                  headers={"X-ST-Michael-Delivery-Id": f"gh-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}-part-{i}"})
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      result = json.loads(resp.read())
              except Exception:
                  raise SystemExit("Telegram delivery unconfirmed") from None
              state = "queued" if result.get("queued") is True else "delivered" if result.get("ok") is True else "unconfirmed"
              print(f"chunk {i + 1}/{len(chunks)}: {state}")
              if state == "unconfirmed":
                  raise SystemExit(1)
              time.sleep(1)
          PY
          echo "=== Доставка или приём в очередь подтверждены ==="
