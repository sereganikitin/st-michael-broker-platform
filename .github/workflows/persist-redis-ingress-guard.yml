name: Persist external Redis ingress protection

on:
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  report:
    name: Persist Redis firewall and verify resource recovery
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - name: Checkout exact reviewed diagnostic
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Validate source and report over pinned SSH
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          EXPECTED_SSH_FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          test "$EXPECTED_REPOSITORY" = sereganikitin/st-michael-broker-platform || exit 1
          test "$EXPECTED_REF" = refs/heads/master || exit 1
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || exit 1
          test -n "$SSH_HOST" -a -n "$SSH_USER" -a -n "$SSH_PRIVATE_KEY" -a -n "$DEPLOY_PATH" || exit 1
          case "$SSH_HOST" in ""|-*|*[[:space:]]*) exit 1;; esac
          [[ "$SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]{0,63}$ ]] || exit 1
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && test "$SSH_PORT" -ge 1 -a "$SSH_PORT" -le 65535 || exit 1
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || exit 1
          case "$DEPLOY_PATH/" in *"/../"*|*"/./"*|*"//"*) exit 1;; esac
          [[ "$EXPECTED_SSH_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || exit 1
          ssh_root=$(mktemp -d)
          known_hosts="$ssh_root/known_hosts"
          private_key="$ssh_root/deploy-key"
          trap 'rm -f -- "$known_hosts" "$private_key"; rmdir -- "$ssh_root" 2>/dev/null || true' EXIT
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$private_key"
          chmod 600 "$private_key"
          timeout 15 ssh-keyscan -p "$SSH_PORT" -t ed25519 "$SSH_HOST" > "$known_hosts" 2>/dev/null
          chmod 600 "$known_hosts"
          mapfile -t fingerprints < <(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}' | sort -u)
          test "${#fingerprints[@]}" -eq 1 || exit 1
          test "${fingerprints[0]}" = "$EXPECTED_SSH_FINGERPRINT" || exit 1
          timeout --foreground 6m ssh -T -i "$private_key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o NumberOfPasswordPrompts=0 \
            -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "${SSH_USER}@${SSH_HOST}" \
            "bash -s -- '$DEPLOY_PATH' '$EXPECTED_SHA'" <<'REMOTE'
          set -euo pipefail
          export LC_ALL=C
          unit=/etc/systemd/system/stm-redis-ingress-guard.service
          test ! -e "$unit" -a ! -L "$unit"
          command -v iptables ip6tables systemctl >/dev/null
          sudo -n tee "$unit" >/dev/null <<'UNIT'
          [Unit]
          Description=Block external Redis ingress while preserving internal application access
          After=docker.service network-online.target
          Requires=docker.service
          PartOf=docker.service
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/bin/sh -ec 'for c in INPUT DOCKER-USER; do /usr/sbin/iptables -C "$c" -i eth0 -p tcp --dport 6379 -j DROP 2>/dev/null || /usr/sbin/iptables -I "$c" 1 -i eth0 -p tcp --dport 6379 -j DROP; done; /usr/sbin/ip6tables -C INPUT -i eth0 -p tcp --dport 6379 -j DROP 2>/dev/null || /usr/sbin/ip6tables -I INPUT 1 -i eth0 -p tcp --dport 6379 -j DROP; if /usr/sbin/ip6tables -nL DOCKER-USER >/dev/null 2>&1; then /usr/sbin/ip6tables -C DOCKER-USER -i eth0 -p tcp --dport 6379 -j DROP 2>/dev/null || /usr/sbin/ip6tables -I DOCKER-USER 1 -i eth0 -p tcp --dport 6379 -j DROP; fi'
          [Install]
          WantedBy=multi-user.target docker.service
          UNIT
          sudo -n chmod 0644 "$unit"
          sudo -n systemd-analyze verify "$unit"
          sudo -n systemctl daemon-reload
          sudo -n systemctl enable --now stm-redis-ingress-guard.service
          sudo -n systemctl is-active stm-redis-ingress-guard.service
          echo REDIS_MODULES
          docker exec st-michael-redis redis-cli MODULE LIST
          echo CONTAINER_PROCESS_METADATA
          docker top st-michael-redis -eo pid,ppid,state,pcpu,rss,comm
          echo RESOURCE_RECOVERY
          free -h
          cat /proc/pressure/io /proc/pressure/memory
          vmstat 1 5
          timeout 10 iostat -xz 1 3 || true
          docker exec st-michael-redis redis-cli ping
          for i in 1 2 3; do
            for endpoint in / /api/health/ready; do
              curl --fail --silent --show-error --max-time 10 --output /dev/null --write-out "endpoint=$endpoint http=%{http_code} total=%{time_total}\n" "https://broker.stmichael.ru$endpoint"
            done
          done
          REMOTE
