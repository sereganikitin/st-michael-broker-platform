name: Server disk report (pinned, read-only)

# Metadata and aggregates only. No deletion, pruning, backup, file moves,
# service restart, deployment fetch or temporary script on the server.
on:
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  report:
    name: Inspect release disk headroom without changes
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - name: Checkout exact reviewed diagnostic
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Validate source and report over pinned SSH
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          EXPECTED_SSH_FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
          PRODUCTION_PG_SYSTEM_IDENTIFIER: ${{ vars.PRODUCTION_PG_SYSTEM_IDENTIFIER }}
          PRODUCTION_MIN_BROKER_ROWS: ${{ vars.PRODUCTION_MIN_BROKER_ROWS }}
        run: |
          set -euo pipefail
          test "$EXPECTED_REPOSITORY" = sereganikitin/st-michael-broker-platform || exit 1
          test "$EXPECTED_REF" = refs/heads/master || exit 1
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || exit 1
          test -n "$SSH_HOST" -a -n "$SSH_USER" -a -n "$SSH_PRIVATE_KEY" -a -n "$DEPLOY_PATH" || exit 1
          case "$SSH_HOST" in ""|-*|*[[:space:]]*) exit 1;; esac
          [[ "$SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]{0,63}$ ]] || exit 1
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && test "$SSH_PORT" -ge 1 -a "$SSH_PORT" -le 65535 || exit 1
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || exit 1
          case "$DEPLOY_PATH/" in *"/../"*|*"/./"*|*"//"*) exit 1;; esac
          [[ "$EXPECTED_SSH_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || exit 1
          [[ "$PRODUCTION_PG_SYSTEM_IDENTIFIER" =~ ^[0-9]+$ ]] || exit 1
          [[ "$PRODUCTION_MIN_BROKER_ROWS" =~ ^[1-9][0-9]*$ ]] || exit 1
          health=$(curl --fail --silent --show-error --max-time 15 --proto '=https' --tlsv1.2 https://broker.stmichael.ru/api/health)
          deployed_sha=$(printf '%s' "$health" | jq -er '.deployedSha | select(type == "string" and test("^[0-9a-f]{40}$"))')
          unset health
          compare_status=$(gh api "/repos/$EXPECTED_REPOSITORY/compare/$deployed_sha...$EXPECTED_SHA" --jq '.status')
          case "$compare_status" in ahead|identical) ;; *) exit 1;; esac
          unset compare_status GH_TOKEN
          ssh_root=$(mktemp -d)
          known_hosts="$ssh_root/known_hosts"
          private_key="$ssh_root/deploy-key"
          trap 'rm -f -- "$known_hosts" "$private_key"; rmdir -- "$ssh_root" 2>/dev/null || true' EXIT
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$private_key"
          chmod 600 "$private_key"
          timeout 15 ssh-keyscan -p "$SSH_PORT" -t ed25519 "$SSH_HOST" > "$known_hosts" 2>/dev/null
          chmod 600 "$known_hosts"
          mapfile -t fingerprints < <(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}' | sort -u)
          test "${#fingerprints[@]}" -eq 1 || exit 1
          test "${fingerprints[0]}" = "$EXPECTED_SSH_FINGERPRINT" || exit 1
          timeout --foreground 6m ssh -T -i "$private_key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o NumberOfPasswordPrompts=0 \
            -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "${SSH_USER}@${SSH_HOST}" \
            "bash -s -- '$DEPLOY_PATH' '$deployed_sha' '$PRODUCTION_PG_SYSTEM_IDENTIFIER' '$PRODUCTION_MIN_BROKER_ROWS'" <<'REMOTE'
          set -euo pipefail
          export LC_ALL=C GIT_OPTIONAL_LOCKS=0
          deploy_path=$1
          expected_deployed_sha=$2
          expected_system_identifier=$3
          minimum_broker_rows=$4
          for tool in awk df docker du find flock git readlink stat sudo timeout; do command -v "$tool" >/dev/null || exit 1; done
          [[ "$deploy_path" =~ ^/[A-Za-z0-9._/-]+$ ]] || exit 1
          case "$deploy_path/" in *"/../"*|*"/./"*|*"//"*) exit 1;; esac
          [[ "$expected_deployed_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$expected_system_identifier" =~ ^[0-9]+$ ]] || exit 1
          [[ "$minimum_broker_rows" =~ ^[1-9][0-9]*$ ]] || exit 1
          deploy_root=$(readlink -f -- "$deploy_path")
          test -n "$deploy_root" -a "$deploy_root" != / -a -d "$deploy_root" || exit 1
          test -f /tmp/st-michael-production-deploy.lock -a ! -L /tmp/st-michael-production-deploy.lock || exit 1
          exec 9</tmp/st-michael-production-deploy.lock
          flock -s -n 9 || { echo "Production release lock busy"; exit 1; }
          cd -- "$deploy_root"
          test "$(git rev-parse --show-toplevel)" = "$deploy_root" || exit 1
          test "$(git remote get-url origin)" = https://github.com/sereganikitin/st-michael-broker-platform.git || exit 1
          test "$(git symbolic-ref --short HEAD)" = master || exit 1
          test "$(git rev-parse HEAD)" = "$expected_deployed_sha" || exit 1
          test "$(docker inspect --format '{{.State.Running}}' st-michael-api)" = true || exit 1
          test "$(docker exec st-michael-api sh -c 'printf %s "$GIT_SHA"')" = "$expected_deployed_sha" || exit 1
          docker_root_reported=$(docker info --format '{{.DockerRootDir}}')
          [[ "$docker_root_reported" =~ ^/[A-Za-z0-9._/-]+$ ]] || exit 1
          case "$docker_root_reported/" in *"/../"*|*"/./"*|*"//"*) exit 1;; esac
          docker_root=$(readlink -f -- "$docker_root_reported")
          test -n "$docker_root" -a "$docker_root" != / -a -d "$docker_root" || exit 1
          backup_path=/var/backups/stmichael/loyalty-predeploy
          test -d "$backup_path" -a ! -L "$backup_path" || exit 1
          test "$(readlink -f -- "$backup_path")" = "$backup_path" || exit 1
          report_fs() {
            local label=$1 path=$2 available total
            available=$(df -P -B1 -- "$path" | awk 'NR==2 {print $4}')
            total=$(df -P -B1 -- "$path" | awk 'NR==2 {print $2}')
            [[ "$available" =~ ^[0-9]+$ ]] && [[ "$total" =~ ^[0-9]+$ ]] || exit 1
            printf '%s_available_bytes=%s\n%s_total_bytes=%s\n' "$label" "$available" "$label" "$total"
            df -P -i -- "$path" | awk -v label="$label" 'NR==2 {printf "%s_inodes_available=%s\n",label,$4}'
          }
          report_fs root /
          report_fs deploy "$deploy_root"
          report_fs release_context /tmp
          report_fs docker_root "$docker_root"
          report_fs backup "$backup_path"
          # One read-only aggregate query, never row contents or DB credentials.
          database_metrics=$(docker exec st-michael-postgres psql -U postgres -d broker_platform \
            --no-psqlrc -AtF '|' -v ON_ERROR_STOP=1 -c \
            "BEGIN READ ONLY; SET LOCAL statement_timeout='5s'; SET LOCAL lock_timeout='1s'; SELECT system_identifier, (SELECT count(*) FROM public.brokers), pg_database_size(current_database()) FROM pg_control_system(); ROLLBACK;" \
            | awk -F'|' 'NF==3 && $1 ~ /^[0-9]+$/ {print}')
          IFS='|' read -r system_identifier broker_rows database_size_bytes <<< "$database_metrics"
          test "$system_identifier" = "$expected_system_identifier" || exit 1
          [[ "$broker_rows" =~ ^[0-9]+$ ]] && test "$broker_rows" -ge "$minimum_broker_rows" || exit 1
          [[ "$database_size_bytes" =~ ^[1-9][0-9]{0,17}$ ]] || exit 1
          printf 'database_size_bytes=%s\nrequired_backup_available_bytes=%s\n' "$database_size_bytes" "$((8589934592 + database_size_bytes + 67108864))"
          docker system df
          sudo -n journalctl --disk-usage || echo "journal_usage_unavailable=true"
          if sudo -n test -d /var/log/journal; then
            sudo -n find /var/log/journal -maxdepth 2 -type f -name '*@*.journal' -printf '%s\n' \
              | awk '{sum+=$1;count++} END {printf "archived_journal_count=%d\narchived_journal_bytes=%.0f\n",count,sum}'
          fi
          # Bounded exact rehearsal metadata: do not read content or follow links.
          count=0
          while IFS= read -r -d '' candidate; do
            name=${candidate##*/}
            [[ "$name" =~ ^loyalty-rehearsal-[0-9]+(\.dump|-schema\.[A-Za-z0-9]{6})$|^rehearse-loyalty-migration\.[A-Za-z0-9]{6}\.sh$ ]] || continue
            test ! -L "$candidate" || continue
            test "$(readlink -f -- "$candidate")" = "$candidate" || continue
            count=$((count + 1))
            if [ "$count" -gt 50 ]; then echo "temporary_inventory_truncated=true"; break; fi
            printf 'rehearsal_artifact=%s ' "$name"
            stat -c 'type=%F bytes=%s mtime_epoch=%Y' -- "$candidate"
            if [ -d "$candidate" ]; then timeout 20 du -s -B1 -- "$candidate" | awk '{printf "rehearsal_directory_disk_bytes=%s\n",$1}'; fi
          done < <(find /tmp -maxdepth 1 \( -name 'loyalty-rehearsal-*' -o -name 'rehearse-loyalty-migration.*.sh' \) -print0)
          printf 'rehearsal_artifact_count_bounded=%s\n' "$count"
          docker ps -a --filter 'name=^/loyalty-rehearsal-[0-9]+$' --format 'rehearsal_container={{.Names}} state={{.State}}'
          docker network ls --format '{{.Name}}' | awk '/^loyalty-rehearsal-[0-9]+-net$/ {print "rehearsal_network=" $0}'
          echo "inspection_only=true"
          REMOTE
