name: Reclaim production disk (no restart)

# Two separately approved scopes; neither restarts services or writes database,
# backup or deployment state. Journals remain the default (no journal rotation).
on:
  workflow_dispatch:
    inputs:
      confirm_cleanup:
        description: Confirm only the explicitly selected cleanup scope
        required: true
        default: false
        type: boolean
      cleanup_scope:
        description: Archived journals OR unused Docker cache and dangling images
        required: true
        default: journals
        type: choice
        options:
          - journals
          - docker

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reclaim:
    name: Reclaim only approved production disk space
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout exact reviewed maintenance source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify host and run no-restart cleanup
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          CANONICAL_REPOSITORY: sereganikitin/st-michael-broker-platform
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          EXPECTED_SSH_FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
          PRODUCTION_PG_SYSTEM_IDENTIFIER: ${{ vars.PRODUCTION_PG_SYSTEM_IDENTIFIER }}
          PRODUCTION_MIN_BROKER_ROWS: ${{ vars.PRODUCTION_MIN_BROKER_ROWS }}
        run: |
          set -euo pipefail
          CONFIRM_CLEANUP=$(jq -er '.inputs.confirm_cleanup | if . == true or . == "true" then "true" else error("Explicit cleanup confirmation required") end' "$GITHUB_EVENT_PATH")
          test "$CONFIRM_CLEANUP" = "true" || { echo "Explicit cleanup confirmation is required"; exit 1; }
          CLEANUP_SCOPE=$(jq -er '.inputs.cleanup_scope | if . == null then "journals" elif . == "journals" or . == "docker" then . else error("Invalid cleanup scope") end' "$GITHUB_EVENT_PATH")
          case "$CLEANUP_SCOPE" in journals|docker) ;; *) echo "Invalid cleanup scope"; exit 1;; esac
          test "$EXPECTED_REPOSITORY" = "$CANONICAL_REPOSITORY" || { echo "Cleanup is restricted to the canonical repository"; exit 1; }
          test "$EXPECTED_REF" = "refs/heads/master" || { echo "Cleanup is restricted to master"; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || exit 1
          test -n "$SSH_HOST" -a -n "$SSH_USER" -a -n "$SSH_PRIVATE_KEY" -a -n "$DEPLOY_PATH" || { echo "Production SSH configuration is incomplete"; exit 1; }
          case "$SSH_HOST" in ""|-*|*[[:space:]]*) echo "Invalid SSH host"; exit 1;; esac
          [[ "$SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]{0,63}$ ]] || { echo "Invalid SSH user"; exit 1; }
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && test "$SSH_PORT" -ge 1 -a "$SSH_PORT" -le 65535 || { echo "Invalid SSH port"; exit 1; }
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Invalid deploy path"; exit 1; }
          case "$DEPLOY_PATH/" in *"/../"*|*"/./"*|*"//"*) echo "Unsafe deploy path"; exit 1;; esac
          [[ "$EXPECTED_SSH_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || { echo "Production SSH fingerprint variable is missing or invalid"; exit 1; }
          [[ "$PRODUCTION_PG_SYSTEM_IDENTIFIER" =~ ^[0-9]+$ ]] || exit 1
          [[ "$PRODUCTION_MIN_BROKER_ROWS" =~ ^[1-9][0-9]*$ ]] || exit 1
          health=$(curl --fail --silent --show-error --max-time 15 --proto '=https' --tlsv1.2 https://broker.stmichael.ru/api/health)
          deployed_sha=$(printf '%s' "$health" | jq -er '.deployedSha | select(type == "string" and test("^[0-9a-f]{40}$"))')
          unset health
          compare_status=$(gh api "/repos/$EXPECTED_REPOSITORY/compare/$deployed_sha...$EXPECTED_SHA" --jq '.status')
          case "$compare_status" in ahead|identical) ;; *) exit 1;; esac
          unset compare_status GH_TOKEN

          ssh_root=$(mktemp -d)
          known_hosts="$ssh_root/known_hosts"
          private_key="$ssh_root/deploy-key"
          trap 'rm -f -- "$known_hosts" "$private_key"; rmdir -- "$ssh_root" 2>/dev/null || true' EXIT
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$private_key"
          chmod 600 "$private_key"
          timeout 15 ssh-keyscan -p "$SSH_PORT" -t ed25519 "$SSH_HOST" > "$known_hosts" 2>/dev/null
          chmod 600 "$known_hosts"
          mapfile -t fingerprints < <(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}' | sort -u)
          test "${#fingerprints[@]}" -eq 1 || { echo "Expected exactly one production ED25519 fingerprint"; exit 1; }
          test "${fingerprints[0]}" = "$EXPECTED_SSH_FINGERPRINT" || { echo "Production SSH host fingerprint mismatch"; exit 1; }

          timeout --foreground 8m ssh -T -i "$private_key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o NumberOfPasswordPrompts=0 \
            -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "${SSH_USER}@${SSH_HOST}" \
            "bash -s -- '$DEPLOY_PATH' '$deployed_sha' '$PRODUCTION_PG_SYSTEM_IDENTIFIER' '$PRODUCTION_MIN_BROKER_ROWS' '$CLEANUP_SCOPE'" <<'REMOTE'
          set -euo pipefail
          export LC_ALL=C GIT_OPTIONAL_LOCKS=0
          MIN_AVAILABLE_BYTES=8589934592
          BACKUP_SIZE_OVERHEAD_BYTES=67108864
          deploy_path=$1
          expected_deployed_sha=$2
          expected_system_identifier=$3
          minimum_broker_rows=$4
          cleanup_scope=$5

          case "$cleanup_scope" in journals|docker) ;; *) echo "Invalid cleanup scope"; exit 1;; esac
          for tool in awk curl df docker flock git jq readlink sort timeout; do command -v "$tool" >/dev/null || exit 1; done
          [[ "$expected_deployed_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$expected_system_identifier" =~ ^[0-9]+$ ]] || exit 1
          [[ "$minimum_broker_rows" =~ ^[1-9][0-9]*$ ]] || exit 1

          [[ "$deploy_path" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Invalid deploy path"; exit 1; }
          case "$deploy_path/" in *"/../"*|*"/./"*|*"//"*) echo "Unsafe deploy path"; exit 1;; esac
          deploy_root=$(readlink -f -- "$deploy_path")
          test -n "$deploy_root" -a "$deploy_root" != "/" -a -d "$deploy_root" || { echo "Resolved deploy path must be an existing absolute non-root directory"; exit 1; }

          # Exclusive existing physical lock: no creation or truncation.
          test -f /tmp/st-michael-production-deploy.lock -a ! -L /tmp/st-michael-production-deploy.lock || exit 1
          test "$(readlink -f -- /tmp/st-michael-production-deploy.lock)" = /tmp/st-michael-production-deploy.lock || exit 1
          exec 9</tmp/st-michael-production-deploy.lock
          if ! flock -n 9; then
            echo "Another production deploy/migration process holds the server lock"
            exit 1
          fi
          cd -- "$deploy_root"
          test "$(git rev-parse --show-toplevel)" = "$deploy_root" || exit 1
          test "$(git remote get-url origin)" = https://github.com/sereganikitin/st-michael-broker-platform.git || exit 1
          test "$(git symbolic-ref --short HEAD)" = master || exit 1
          test "$(git rev-parse HEAD)" = "$expected_deployed_sha" || exit 1
          test -z "${DOCKER_HOST:-}" -a -z "${DOCKER_CONTEXT:-}" || exit 1
          test "$(docker context show)" = default || exit 1
          docker_endpoint=$(docker context inspect default --format '{{.Endpoints.docker.Host}}')
          case "$docker_endpoint" in unix:///*) ;; *) echo "Docker endpoint is not a local Unix socket"; exit 1;; esac
          test "$(docker inspect --format '{{.State.Running}}' st-michael-api)" = true || exit 1
          test "$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.service" }}' st-michael-api)" = api || exit 1
          test "$(docker exec st-michael-api sh -c 'printf %s "$GIT_SHA"')" = "$expected_deployed_sha" || exit 1
          api_started_before=$(docker inspect --format '{{.State.StartedAt}}' st-michael-api)
          assert_health() {
            local health_sha
            health_sha=$(curl --fail --silent --show-error --max-time 15 --proto '=https' --tlsv1.2 https://broker.stmichael.ru/api/health \
              | jq -er '.deployedSha | select(type == "string" and test("^[0-9a-f]{40}$"))')
            test "$health_sha" = "$expected_deployed_sha" || { echo "Production health identity mismatch"; exit 1; }
          }
          assert_health

          available_bytes() {
            df -P -B1 -- "$1" | awk 'NR == 2 { print $4 }'
          }

          require_uint() {
            [[ "$1" =~ ^[0-9]{1,18}$ ]] || { echo "Aggregate metric is invalid"; exit 1; }
          }

          docker_root_reported=$(docker info --format '{{.DockerRootDir}}')
          [[ "$docker_root_reported" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "DockerRootDir is not a safe absolute path"; exit 1; }
          case "$docker_root_reported/" in *"/../"*|*"/./"*|*"//"*) echo "DockerRootDir contains an unsafe segment"; exit 1;; esac
          docker_root=$(readlink -f -- "$docker_root_reported")
          test -n "$docker_root" -a "$docker_root" != "/" -a -d "$docker_root" || { echo "Resolved DockerRootDir must be an existing absolute non-root directory"; exit 1; }
          backup_path=/var/backups/stmichael/loyalty-predeploy
          test -d "$backup_path" -a ! -L "$backup_path" || exit 1
          test "$(readlink -f -- "$backup_path")" = "$backup_path" || exit 1
          if [ "$cleanup_scope" = journals ]; then
            for tool in find journalctl sudo; do command -v "$tool" >/dev/null || exit 1; done
            # Journal branch only: refuse symlinked parents or descendants.
            journal_path=/var/log/journal
            sudo -n test -d "$journal_path" || exit 1
            sudo -n test ! -L "$journal_path" || exit 1
            test "$(sudo -n readlink -f -- "$journal_path")" = "$journal_path" || exit 1
            journal_symlink=$(sudo -n timeout 15 find "$journal_path" -type l -printf x -quit 2>/dev/null)
            test -z "$journal_symlink" || { echo "Journal archive path contains a symlink"; exit 1; }
          fi

          container_snapshot() {
            local container_ids container_id details
            container_ids=$(docker ps -aq --no-trunc 2>/dev/null | sort -u) || { echo "Container enumeration failed" >&2; return 1; }
            test -n "$container_ids" || { echo "Container inventory is empty" >&2; return 1; }
            while IFS= read -r container_id; do
              [[ "$container_id" =~ ^[0-9a-f]{64}$ ]] || return 1
              details=$(docker inspect --format '{{.Id}}|{{.Image}}|{{.State.StartedAt}}|{{.State.Status}}|{{.State.Running}}|{{.State.Paused}}|{{.State.Restarting}}|{{.State.OOMKilled}}|{{.State.Dead}}|{{.State.ExitCode}}|{{.State.FinishedAt}}|{{.State.Pid}}|{{.RestartCount}}' "$container_id" 2>/dev/null) || { echo "Container snapshot failed" >&2; return 1; }
              [[ "$details" == "$container_id|sha256:"* ]] || return 1
              printf '%s\n' "$details"
            done <<< "$container_ids"
          }
          tagged_image_snapshot() {
            local image_inventory tag image_id extra
            image_inventory=$(docker image ls --all --no-trunc --format '{{.Repository}}:{{.Tag}}|{{.ID}}' 2>/dev/null) || { echo "Tagged image enumeration failed" >&2; return 1; }
            test -n "$image_inventory" || { echo "Image inventory is empty" >&2; return 1; }
            while IFS='|' read -r tag image_id extra; do
              test -n "$tag" -a -z "$extra" || return 1
              [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]] || return 1
              case "$tag" in '<none>:'*|*':<none>') continue;; esac
              printf '%s|%s\n' "$tag" "$image_id"
            done <<< "$image_inventory"
          }
          rollback_image_snapshot() {
            printf '%s\n' "$1" | awk -F'|' '$1 ~ /^st-michael-rollback-(api|web):/ {print}' || return 1
          }
          inspect_rollback_metadata() {
            local release_dir=/var/backups/stmichael/releases release_names record_name record resolved size values image_id all_image_ids inspected_id match_status
            local -a release_records=()
            metadata_record_count=0
            metadata_missing_image_references=0
            metadata_existing_image_ids=''
            for tool in find grep stat; do command -v "$tool" >/dev/null || return 1; done
            if ! test -e "$release_dir" && ! test -L "$release_dir"; then return 0; fi
            test -d "$release_dir" -a ! -L "$release_dir" || { echo "Rollback metadata directory must be physical" >&2; return 1; }
            resolved=$(readlink -f -- "$release_dir") || return 1
            test "$resolved" = "$release_dir" || { echo "Rollback metadata directory must resolve exactly" >&2; return 1; }
            release_names=$(timeout 15 find "$release_dir" -maxdepth 1 -name 'release-*.txt' -printf '%f\n' 2>/dev/null | awk 'NR <= 2001 {print}') || { echo "Rollback metadata enumeration failed" >&2; return 1; }
            if [ -n "$release_names" ]; then mapfile -t release_records <<< "$release_names"; fi
            test "${#release_records[@]}" -le 2000 || { echo "Rollback metadata record bound exceeded" >&2; return 1; }
            metadata_record_count=${#release_records[@]}
            all_image_ids=$(docker image ls --all --quiet --no-trunc 2>/dev/null | sort -u) || { echo "Rollback image enumeration failed" >&2; return 1; }
            test -n "$all_image_ids" || return 1
            while IFS= read -r image_id; do [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]] || return 1; done <<< "$all_image_ids"
            for record_name in "${release_records[@]}"; do
              [[ "$record_name" =~ ^release-[A-Za-z0-9._-]+\.txt$ ]] || { echo "Rollback metadata record name is invalid" >&2; return 1; }
              record="$release_dir/$record_name"
              test -f "$record" -a ! -L "$record" || { echo "Rollback metadata record must be a physical file" >&2; return 1; }
              resolved=$(readlink -f -- "$record") || return 1
              test "$resolved" = "$record" || return 1
              size=$(stat -c '%s' -- "$record" 2>/dev/null) || return 1
              [[ "$size" =~ ^[0-9]{1,9}$ ]] && test "$size" -le 65536 || { echo "Rollback metadata record size is invalid" >&2; return 1; }
              values=$(awk -F'=' '
                $1 == "previous_api_image" || $1 == "previous_web_image" || $1 == "previous_nginx_image" {
                  if (NF != 2 || ++seen[$1] != 1) exit 1
                  print $2
                }
                END { if (seen["previous_api_image"] != 1 || seen["previous_web_image"] != 1 || seen["previous_nginx_image"] != 1) exit 1 }
              ' "$record") || { echo "Rollback metadata image fields are invalid" >&2; return 1; }
              while IFS= read -r image_id; do
                [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Rollback metadata image ID is invalid" >&2; return 1; }
                if grep -Fx -- "$image_id" <<< "$all_image_ids" >/dev/null; then
                  inspected_id=$(docker image inspect --format '{{.Id}}' "$image_id" 2>/dev/null) || { echo "Existing rollback image inspection failed" >&2; return 1; }
                  test "$inspected_id" = "$image_id" || return 1
                  if ! printf '%s\n' "$tagged_images_before" | awk -F'|' -v id="$image_id" '$2 == id {found=1} END {exit !found}'; then
                    echo "untagged_rollback_images_require_protection=true" >&2
                    echo "cleanup_performed=false" >&2
                    echo "Untagged rollback images require protection; cleanup not performed" >&2
                    return 1
                  fi
                  metadata_existing_image_ids+="$image_id"$'\n'
                else
                  match_status=$?
                  test "$match_status" -eq 1 || return 1
                  metadata_missing_image_references=$((metadata_missing_image_references + 1))
                fi
              done <<< "$values"
            done
            metadata_existing_image_ids=$(printf '%s' "$metadata_existing_image_ids" | awk 'NF' | sort -u) || return 1
          }
          assert_metadata_images_present() {
            local image_id inspected_id
            if [ -z "$metadata_existing_image_ids" ]; then return 0; fi
            while IFS= read -r image_id; do
              inspected_id=$(docker image inspect --format '{{.Id}}' "$image_id" 2>/dev/null) || { echo "Rollback metadata image became unavailable" >&2; return 1; }
              test "$inspected_id" = "$image_id" || return 1
            done <<< "$metadata_existing_image_ids"
          }
          assert_referenced_images() {
            local image_ids image_id inspected_id
            image_ids=$(printf '%s\n' "$1" | awk -F'|' '{print $2}' | sort -u) || return 1
            while IFS= read -r image_id; do
              [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]] || return 1
              inspected_id=$(docker image inspect --format '{{.Id}}' "$image_id" 2>/dev/null) || { echo "Container-referenced image is unavailable" >&2; return 1; }
              test "$inspected_id" = "$image_id" || return 1
            done <<< "$image_ids"
          }
          assert_docker_inventory_unchanged() {
            local containers_now tagged_images_now rollback_images_now
            containers_now=$(container_snapshot) || return 1
            tagged_images_now=$(tagged_image_snapshot | sort -u) || return 1
            rollback_images_now=$(rollback_image_snapshot "$tagged_images_now") || return 1
            test "$containers_now" = "$containers_before" || { echo "Container identity or runtime state changed during cleanup" >&2; return 1; }
            test "$tagged_images_now" = "$tagged_images_before" || { echo "Tagged image inventory changed during cleanup" >&2; return 1; }
            test "$rollback_images_now" = "$rollback_images_before" || { echo "Rollback tag/image identity changed during cleanup" >&2; return 1; }
            assert_referenced_images "$containers_before" || return 1
            assert_metadata_images_present || return 1
          }
          perform_selected_cleanup() {
            case "$cleanup_scope" in
              journals)
                # Archived journals only; deliberately no --rotate.
                sudo -n journalctl --directory="$journal_path" --vacuum-size=300M >/dev/null 2>&1 || { echo "Approved journal cleanup failed" >&2; return 1; }
                ;;
              docker)
                # No tagged, rollback or container-referenced image is a target.
                docker builder prune --all --force >/dev/null 2>&1 || { echo "Approved builder-cache cleanup failed" >&2; return 1; }
                assert_docker_inventory_unchanged || return 1
                # Without --all: dangling, untagged AND unused images only.
                docker image prune --force >/dev/null 2>&1 || { echo "Approved dangling-image cleanup failed" >&2; return 1; }
                ;;
              *) echo "Invalid cleanup scope" >&2; return 1;;
            esac
          }
          read_database_size() {
            local metrics system_identifier broker_rows size
            test "$(docker inspect --format '{{.State.Running}}' st-michael-postgres)" = true || exit 1
            metrics=$(docker exec st-michael-postgres psql -U postgres -d broker_platform \
              --no-psqlrc -AtF '|' -v ON_ERROR_STOP=1 -c \
              "BEGIN READ ONLY; SET LOCAL statement_timeout='5s'; SET LOCAL lock_timeout='1s'; SELECT system_identifier, (SELECT count(*) FROM public.brokers), pg_database_size(current_database()) FROM pg_control_system(); ROLLBACK;" \
              | awk -F'|' 'NF==3 && $1 ~ /^[0-9]+$/ {print}')
            [[ "$metrics" =~ ^[0-9]+\|[0-9]+\|[1-9][0-9]{0,17}$ ]] || exit 1
            IFS='|' read -r system_identifier broker_rows size <<< "$metrics"
            test "$system_identifier" = "$expected_system_identifier" || { echo "Production database identity mismatch"; exit 1; }
            require_uint "$broker_rows"
            test "$broker_rows" -ge "$minimum_broker_rows" || { echo "Production broker-row floor failed"; exit 1; }
            printf '%s' "$size"
          }
          database_size_bytes=$(read_database_size)
          required_backup_available_bytes=$((MIN_AVAILABLE_BYTES + database_size_bytes + BACKUP_SIZE_OVERHEAD_BYTES))
          if [ "$cleanup_scope" = docker ]; then
            containers_before=$(container_snapshot) || exit 1
            tagged_images_before=$(tagged_image_snapshot | sort -u) || exit 1
            rollback_images_before=$(rollback_image_snapshot "$tagged_images_before") || exit 1
            assert_referenced_images "$containers_before" || exit 1
            inspect_rollback_metadata || exit 1
            printf 'rollback_metadata_records_checked=%s\n' "$metadata_record_count"
            printf 'historical_missing_image_references=%s\n' "$metadata_missing_image_references"
            if [ "$metadata_missing_image_references" -gt 0 ]; then echo "historical_rollback_images_already_missing=true"; else echo "historical_rollback_images_already_missing=false"; fi
            echo "existing_rollback_metadata_images_protected=true"
          fi

          root_before=$(available_bytes /)
          deploy_before=$(available_bytes "$deploy_root")
          release_context_before=$(available_bytes /tmp)
          docker_before=$(available_bytes "$docker_root")
          backup_before=$(available_bytes "$backup_path")
          require_uint "$root_before"
          require_uint "$deploy_before"
          require_uint "$release_context_before"
          require_uint "$docker_before"
          require_uint "$backup_before"
          require_uint "$required_backup_available_bytes"

          printf 'root_available_bytes_before=%s\n' "$root_before"
          printf 'deploy_available_bytes_before=%s\n' "$deploy_before"
          printf 'release_context_available_bytes_before=%s\n' "$release_context_before"
          printf 'docker_root_available_bytes_before=%s\n' "$docker_before"
          printf 'backup_available_bytes_before=%s\ndatabase_size_bytes=%s\nrequired_backup_available_bytes=%s\n' \
            "$backup_before" "$database_size_bytes" "$required_backup_available_bytes"

          if [ "$root_before" -ge "$MIN_AVAILABLE_BYTES" ] \
            && [ "$deploy_before" -ge "$MIN_AVAILABLE_BYTES" ] \
            && [ "$release_context_before" -ge "$MIN_AVAILABLE_BYTES" ] \
            && [ "$docker_before" -ge "$MIN_AVAILABLE_BYTES" ] \
            && [ "$backup_before" -ge "$required_backup_available_bytes" ]; then
            cleanup_performed=false
            cleanup_reason=already_sufficient
          else
            perform_selected_cleanup || exit 1
            cleanup_performed=true
            cleanup_reason=backup_or_release_reserve_below_threshold
          fi
          root_after=$(available_bytes /)
          deploy_after=$(available_bytes "$deploy_root")
          release_context_after=$(available_bytes /tmp)
          docker_after=$(available_bytes "$docker_root")
          backup_after=$(available_bytes "$backup_path")
          post_database_size_bytes=$(read_database_size)
          required_backup_available_bytes_after=$((MIN_AVAILABLE_BYTES + post_database_size_bytes + BACKUP_SIZE_OVERHEAD_BYTES))
          for metric in "$root_after" "$deploy_after" "$release_context_after" "$docker_after" "$backup_after" "$required_backup_available_bytes_after"; do require_uint "$metric"; done
          assert_health
          test "$(git rev-parse HEAD)" = "$expected_deployed_sha" || exit 1
          test "$(docker inspect --format '{{.State.Running}}' st-michael-api)" = true || exit 1
          test "$(docker exec st-michael-api sh -c 'printf %s "$GIT_SHA"')" = "$expected_deployed_sha" || exit 1
          test "$(docker inspect --format '{{.State.StartedAt}}' st-michael-api)" = "$api_started_before" || { echo "API runtime changed during maintenance"; exit 1; }
          if [ "$cleanup_scope" = docker ]; then
            assert_docker_inventory_unchanged || exit 1
            echo "all_container_states_unchanged=true"
            echo "all_tagged_images_unchanged=true"
            echo "rollback_tag_image_ids_unchanged=true"
            echo "container_referenced_images_preserved=true"
            echo "existing_rollback_metadata_images_preserved=true"
          fi

          printf 'cleanup_scope=%s\n' "$cleanup_scope"
          printf 'cleanup_performed=%s\n' "$cleanup_performed"
          printf 'cleanup_reason=%s\n' "$cleanup_reason"
          printf 'root_available_bytes_after=%s\n' "$root_after"
          printf 'deploy_available_bytes_after=%s\n' "$deploy_after"
          printf 'release_context_available_bytes_after=%s\n' "$release_context_after"
          printf 'docker_root_available_bytes_after=%s\n' "$docker_after"
          printf 'backup_available_bytes_after=%s\nrequired_backup_available_bytes_after=%s\n' "$backup_after" "$required_backup_available_bytes_after"

          if [ "$root_after" -lt "$MIN_AVAILABLE_BYTES" ] \
            || [ "$deploy_after" -lt "$MIN_AVAILABLE_BYTES" ] \
            || [ "$release_context_after" -lt "$MIN_AVAILABLE_BYTES" ] \
            || [ "$docker_after" -lt "$MIN_AVAILABLE_BYTES" ] \
            || [ "$backup_after" -lt "$required_backup_available_bytes_after" ]; then
            echo "cleanup_threshold_satisfied=false"
            echo "Approved scoped cleanup completed; required backup headroom is still unavailable" >&2
            exit 1
          fi
          echo "health_unchanged=true"
          echo "cleanup_threshold_satisfied=true"
          REMOTE
